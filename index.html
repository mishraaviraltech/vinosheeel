<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vinosheel — Furniture &amp; Electronics ERP (3D)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23B45309'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>V</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
/* ============================================================
   Vinosheel Trading ERP — design system
   Palette: #FFFFFF · #1E3A8A · #2563EB · #10B981 · #F8FAFC
   Type: Inter · Material Symbols · glass · premium shadows
   ============================================================ */

:root {
  --white: #FFFFFF;
  --navy: #1E3A8A;
  --blue: #2563EB;
  --emerald: #10B981;
  --bg: #F8FAFC;
  --bg-2: #FFFFFF;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-2: #EDF1F7;
  --brand: #1E3A8A;
  --brand-2: #2563EB;
  --green: #10B981;
  --amber: #F59E0B;
  --red: #EF4444;
  --violet: #8B5CF6;
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.05);
  --shadow-lg: 0 12px 32px -8px rgba(15,23,42,.16), 0 4px 12px rgba(15,23,42,.08);
  --shadow-glow: 0 0 0 1px rgba(37,99,235,.15), 0 8px 30px -6px rgba(37,99,235,.35);
  --glass: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.65);
  --topbar-h: 64px;
  --sidebar-w: 264px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0B1220;
  --bg-2: #0F172A;
  --ink: #E6EDF7;
  --ink-2: #B6C2D6;
  --muted: #8494AC;
  --line: rgba(148,163,184,.16);
  --line-2: rgba(148,163,184,.10);
  --brand: #3B82F6;
  --brand-2: #60A5FA;
  --green: #34D399;
  --amber: #FBBF24;
  --red: #F87171;
  --violet: #A78BFA;
  --glass: rgba(15,23,42,.66);
  --glass-border: rgba(148,163,184,.14);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 18px rgba(0,0,0,.45);
  --shadow-lg: 0 18px 44px -10px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background .3s ease, color .3s ease;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
a { color: var(--brand-2); text-decoration: none; }
h1,h2,h3,h4 { font-weight: 700; letter-spacing: -.02em; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; user-select: none; }
.icon { font-size: 20px; line-height: 1; vertical-align: middle; }

/* ---------------- scrollbars ---------------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ---------------- splash ---------------- */
.splash {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(37,99,235,.18), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, rgba(16,185,129,.14), transparent 55%),
    var(--bg);
  z-index: 100;
}
.splash-inner { text-align: center; animation: rise .7s cubic-bezier(.2,.8,.2,1); }
.splash-logo {
  width: 96px; height: 96px; border-radius: 26px; margin: 0 auto 22px;
  background: linear-gradient(135deg, var(--navy), var(--brand-2));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 46px; font-weight: 800; letter-spacing: -1px;
  box-shadow: var(--shadow-glow); animation: floaty 3.4s ease-in-out infinite;
}
.splash h1 { font-size: 26px; font-weight: 800; }
.splash p { color: var(--muted); margin-top: 6px; font-size: 14px; }
.splash .bar { width: 220px; height: 4px; background: var(--line); border-radius: 4px; margin: 26px auto 0; overflow: hidden; }
.splash .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, var(--navy), var(--emerald)); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0%{transform:translateX(-110%)} 100%{transform:translateX(320%)} }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes rise { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes pop { from{opacity:0; transform:scale(.96) translateY(8px)} to{opacity:1; transform:none} }

/* ---------------- auth ---------------- */
.auth-wrap { min-height: 100vh; display: flex; position: relative; }
.auth-left {
  flex: 1.1; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between;
  background:
    radial-gradient(900px 500px at 90% -20%, rgba(37,99,235,.28), transparent 55%),
    radial-gradient(700px 480px at -10% 100%, rgba(16,185,129,.22), transparent 50%),
    linear-gradient(150deg, #10265f, #1E3A8A 55%, #16295e);
  color: #E7EEFF; overflow: hidden; position: relative;
}
.auth-left::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 44px 44px; mask-image: radial-gradient(ellipse at 60% 40%, #000 30%, transparent 75%);
}
.auth-left > * { position: relative; z-index: 1; }
.auth-brand { display: flex; align-items: center; gap: 14px; }
.auth-brand .logo {
  width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.14);
  backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 22px; border: 1px solid rgba(255,255,255,.25);
}
.auth-brand b { font-size: 19px; letter-spacing: -.02em; }
.auth-brand small { display: block; color: #AFC3F2; font-weight: 500; font-size: 11.5px; }
.auth-hero h2 { font-size: 34px; line-height: 1.22; font-weight: 800; max-width: 460px; }
.auth-hero h2 span { background: linear-gradient(90deg,#6EE7B7,#93C5FD); -webkit-background-clip: text; background-clip: text; color: transparent; }
.auth-hero p { color: #BFD0F7; max-width: 430px; margin-top: 14px; font-size: 14.5px; }
.auth-stats { display: flex; gap: 26px; }
.auth-stats div b { font-size: 22px; display: block; }
.auth-stats div small { color: #AFC3F2; }
.auth-right {
  flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
}
.auth-card {
  width: 100%; max-width: 420px; background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-radius: var(--r-xl); padding: 34px 32px; box-shadow: var(--shadow-lg);
  animation: pop .45s cubic-bezier(.2,.8,.2,1);
}
.auth-card h3 { font-size: 22px; font-weight: 800; }
.auth-card .sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 24px; }
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.input {
  width: 100%; padding: 11px 13px; border-radius: var(--r-sm); border: 1.5px solid var(--line);
  background: var(--bg-2); transition: border-color .18s, box-shadow .18s;
}
.input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3.5px rgba(37,99,235,.14); }
.input-wrap { position: relative; }
.input-wrap .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 19px; }
.input-wrap .input { padding-left: 40px; }
.input-wrap .trail { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 19px; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px;
  transition: transform .12s, box-shadow .18s, background .18s, opacity .18s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(135deg, var(--navy), var(--brand-2)); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { box-shadow: var(--shadow-glow); }
.btn-green { background: linear-gradient(135deg, #059669, #10B981); color: #fff; }
.btn-ghost { background: var(--bg-2); border: 1.5px solid var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--brand-2); color: var(--brand-2); }
.btn-danger { background: #FEE2E2; color: #B91C1C; }
[data-theme="dark"] .btn-danger { background: rgba(239,68,68,.15); color: #FCA5A5; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn-lg { padding: 13px 22px; font-size: 15px; border-radius: var(--r-md); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.link { color: var(--brand-2); font-weight: 600; font-size: 13.5px; }
.link:hover { text-decoration: underline; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 18px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.otp-row { display: flex; gap: 10px; justify-content: center; margin: 8px 0 20px; }
.otp-row .input { width: 52px; height: 58px; text-align: center; font-size: 22px; font-weight: 700; border-radius: var(--r-md); }
.bio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bio-card {
  border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 18px 12px; text-align: center;
  color: var(--muted); transition: .18s; background: var(--bg-2);
}
.bio-card:hover { border-color: var(--brand-2); color: var(--brand-2); background: rgba(37,99,235,.05); }
.bio-card .icon { font-size: 30px; display: block; margin-bottom: 8px; }
.demo-box {
  margin-top: 20px; border-radius: var(--r-md); padding: 14px; font-size: 12.5px;
  background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.25);
}
.demo-box b { color: var(--green); }
.demo-box .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-variant-numeric: tabular-nums; }
.demo-box button { color: var(--brand-2); font-weight: 600; font-size: 12px; padding: 2px 6px; border-radius: 6px; }
.demo-box button:hover { background: rgba(37,99,235,.1); }

/* ---------------- app shell ---------------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); position: fixed; inset: 0 auto 0 0; z-index: 40;
  display: flex; flex-direction: column;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--line); transition: transform .28s cubic-bezier(.2,.8,.2,1);
}
.sidebar-head { padding: 18px 18px 14px; display: flex; align-items: center; gap: 12px; }
.sidebar-head .logo {
  width: 42px; height: 42px; border-radius: 13px; flex: none;
  background: linear-gradient(135deg, var(--navy), var(--brand-2)); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px;
  box-shadow: var(--shadow-sm);
}
.sidebar-head b { font-size: 15.5px; display: block; line-height: 1.2; }
.sidebar-head small { color: var(--muted); font-size: 11px; }
.sidebar-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 28px; }
.sidebar-section { color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9.5px 12px; border-radius: var(--r-sm);
  color: var(--ink-2); font-weight: 500; font-size: 13.8px; margin-bottom: 2px;
  transition: background .15s, color .15s; position: relative; cursor: pointer; width: 100%; text-align: left;
}
.nav-item .icon { font-size: 20px; }
.nav-item:hover { background: var(--line-2); color: var(--ink); }
.nav-item.active { background: linear-gradient(90deg, rgba(37,99,235,.14), rgba(37,99,235,.05)); color: var(--brand-2); font-weight: 600; }
.nav-item.active::before {
  content: ""; position: absolute; left: -12px; top: 22%; bottom: 22%; width: 3.5px; border-radius: 4px;
  background: linear-gradient(var(--brand-2), var(--emerald));
}
.nav-item .badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 20px; padding: 1px 7px; }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--line); }
.ghost-mode {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm);
  background: rgba(139,92,246,.1); border: 1px solid rgba(139,92,246,.25); color: var(--violet); font-size: 12.5px; font-weight: 600;
}
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .track { position: absolute; inset: 0; border-radius: 20px; background: var(--line); transition: .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: var(--shadow-sm); }
.switch input:checked + .track { background: var(--violet); }
.switch input:checked + .track::after { transform: translateX(16px); }

.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 14px; padding: 0 22px;
  background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; }
.topbar .crumb { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.topbar .crumb b { color: var(--ink); font-size: 14.5px; }
.palette-btn {
  flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-radius: var(--r-sm); border: 1.5px solid var(--line);
  background: var(--bg-2); color: var(--muted); font-size: 13px;
}
.palette-btn:hover { border-color: var(--brand-2); }
.palette-btn kbd {
  margin-left: auto; font-size: 10.5px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
  background: var(--bg); font-family: inherit;
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  color: var(--ink-2); position: relative; transition: background .15s;
}
.icon-btn:hover { background: var(--line-2); }
.icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg-2); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13.5px; flex: none;
  background: linear-gradient(135deg, var(--navy), var(--brand-2));
}
.avatar.green { background: linear-gradient(135deg,#047857,#10B981); }
.avatar.violet { background: linear-gradient(135deg,#6D28D9,#8B5CF6); }
.avatar.amber { background: linear-gradient(135deg,#B45309,#F59E0B); }
.avatar.rose { background: linear-gradient(135deg,#BE123C,#F43F5E); }
.avatar.cyan { background: linear-gradient(135deg,#0E7490,#22D3EE); }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 5px; border-radius: 30px; }
.user-chip:hover { background: var(--line-2); }
.user-chip b { font-size: 13px; display: block; line-height: 1.2; }
.user-chip small { color: var(--muted); font-size: 11px; text-transform: capitalize; }

.content { padding: 24px 26px 60px; flex: 1; animation: fadeIn .25s ease; }
.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 23px; font-weight: 800; letter-spacing: -.03em; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 640px; }
.page-head .spacer { flex: 1; }
.page-head .actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* cards */
.card {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm); transition: box-shadow .2s, transform .2s;
}
.card.hover:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.card-head h3 { font-size: 15px; font-weight: 700; }
.card-head .icon { color: var(--brand-2); }
.card-head .spacer { flex: 1; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

/* KPI */
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.kpi .k-label { color: var(--muted); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .k-value { font-size: 24px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi .k-sub { font-size: 12px; color: var(--muted); }
.kpi .k-icon {
  position: absolute; right: 16px; top: 18px; width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.kpi .k-icon.blue { background: rgba(37,99,235,.1); color: var(--brand-2); }
.kpi .k-icon.green { background: rgba(16,185,129,.12); color: var(--green); }
.kpi .k-icon.amber { background: rgba(245,158,11,.12); color: var(--amber); }
.kpi .k-icon.red { background: rgba(239,68,68,.1); color: var(--red); }
.kpi .k-icon.violet { background: rgba(139,92,246,.12); color: var(--violet); }
.up { color: var(--green); font-weight: 700; }
.down { color: var(--red); font-weight: 700; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th {
  text-align: left; padding: 11px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tbody tr { transition: background .12s; }
.tbl tbody tr:hover { background: rgba(37,99,235,.04); }
.tbl .num { font-variant-numeric: tabular-nums; text-align: right; }
.tbl .strong { font-weight: 700; }

/* pills / status */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 30px; font-size: 11.5px; font-weight: 700; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.green { background: rgba(16,185,129,.12); color: #047857; }
.pill.blue { background: rgba(37,99,235,.12); color: #1D4ED8; }
.pill.amber { background: rgba(245,158,11,.14); color: #B45309; }
.pill.red { background: rgba(239,68,68,.1); color: #B91C1C; }
.pill.gray { background: var(--line-2); color: var(--muted); }
.pill.violet { background: rgba(139,92,246,.12); color: #6D28D9; }
[data-theme="dark"] .pill.green { color:#34D399 } [data-theme="dark"] .pill.blue { color:#93C5FD }
[data-theme="dark"] .pill.amber { color:#FBBF24 } [data-theme="dark"] .pill.red { color:#F87171 }
[data-theme="dark"] .pill.violet { color:#A78BFA }

/* progress */
.progress { height: 7px; background: var(--line-2); border-radius: 8px; overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--brand-2), var(--emerald)); transition: width .6s cubic-bezier(.2,.8,.2,1); }

/* search & filters */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.search-box { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 19px; }
.search-box input { padding-left: 40px; }
.select { padding: 9px 12px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--bg-2); color: var(--ink); }
.select:focus { outline: none; border-color: var(--brand-2); }

/* tree */
.tree-node { margin-left: 18px; border-left: 1.5px dashed var(--line); padding-left: 14px; }
.tree-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
.tree-item:hover { background: var(--line-2); }
.tree-item .chev { color: var(--muted); font-size: 18px; cursor: pointer; transition: transform .2s; }
.tree-item .chev.open { transform: rotate(90deg); }
.tree-item .f-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: rgba(37,99,235,.1); color: var(--brand-2); }

/* chips (AI suggestions) */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 30px;
  border: 1px solid var(--line); background: var(--bg-2); font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  transition: .15s; cursor: pointer;
}
.chip:hover { border-color: var(--brand-2); color: var(--brand-2); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.chip .icon { font-size: 15px; }

/* notifications panel */
.notif-panel {
  position: fixed; top: calc(var(--topbar-h) + 10px); right: 18px; width: 380px; max-height: 74vh; overflow: auto;
  background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg); z-index: 60; animation: pop .25s ease;
}
.notif-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.notif-item:hover { background: var(--line-2); }
.notif-item .n-ic { width: 36px; height: 36px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.notif-item b { font-size: 13px; display: block; }
.notif-item p { font-size: 12.3px; color: var(--muted); margin-top: 2px; }
.notif-item time { font-size: 10.5px; color: var(--muted); }
.notif-item.unread { background: rgba(37,99,235,.05); }

/* dropdown menu */
.menu {
  position: fixed; z-index: 70; min-width: 200px; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s ease;
}
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 9px; font-size: 13.5px; color: var(--ink-2); text-align: left; }
.menu button:hover { background: var(--line-2); color: var(--ink); }
.menu button .icon { font-size: 19px; }
.menu .sep { height: 1px; background: var(--line); margin: 5px 8px; }
.menu button.danger { color: var(--red); }

/* command palette */
.palette {
  position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-start; justify-content: center;
  background: rgba(2,6,23,.45); backdrop-filter: blur(6px); padding-top: 12vh; animation: fadeIn .15s;
}
.palette-box { width: min(620px, 92vw); background: var(--bg-2); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .2s ease; }
.palette-search { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.palette-search input { flex: 1; border: none; outline: none; font-size: 16px; background: transparent; }
.palette-search .icon { color: var(--muted); }
.palette-list { max-height: 46vh; overflow: auto; padding: 8px; }
.palette-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.palette-item:hover, .palette-item.sel { background: var(--line-2); }
.palette-item .icon { color: var(--brand-2); }
.palette-item small { color: var(--muted); }
.palette-item .k { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(2,6,23,.5); backdrop-filter: blur(5px); padding: 20px; animation: fadeIn .15s; }
.modal {
  width: min(560px, 96vw); max-height: 90vh; overflow: auto; background: var(--bg-2); border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg); animation: pop .28s cubic-bezier(.2,.8,.2,1);
}
.modal.wide { width: min(860px, 96vw); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 20px 24px 0; }
.modal-head h3 { font-size: 18px; font-weight: 800; }
.modal-head .icon { color: var(--brand-2); }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 16px 24px 22px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 24px 22px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }

/* toast */
.toast-root { position: fixed; top: 18px; right: 18px; z-index: 120; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex; align-items: center; gap: 12px; min-width: 300px; max-width: 400px;
  background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--glass-border);
  border-radius: var(--r-md); padding: 13px 16px; box-shadow: var(--shadow-lg); animation: pop .3s cubic-bezier(.2,.8,.2,1);
}
.toast .t-ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
.toast b { font-size: 13.5px; display: block; }
.toast p { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.toast.ok .t-ic { background: rgba(16,185,129,.14); color: var(--green); }
.toast.err .t-ic { background: rgba(239,68,68,.12); color: var(--red); }
.toast.info .t-ic { background: rgba(37,99,235,.12); color: var(--brand-2); }
.toast.out { opacity: 0; transform: translateX(30px); transition: .3s; }

/* skeleton */
.skel { position: relative; overflow: hidden; background: var(--line-2); border-radius: 8px; }
.skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: shimmer 1.3s infinite; }
[data-theme="dark"] .skel::after { background: linear-gradient(90deg, transparent, rgba(148,163,184,.14), transparent); }
@keyframes shimmer { 100% { transform: translateX(100%); } }

/* empty state */
.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty .icon { font-size: 44px; opacity: .5; display: block; margin-bottom: 10px; }
.empty b { display: block; color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }

/* AI chat */
.ai-chat { display: flex; flex-direction: column; gap: 12px; max-height: 420px; overflow: auto; padding: 4px 2px; }
.ai-msg { display: flex; gap: 11px; align-items: flex-start; animation: rise .3s ease; }
.ai-msg .av { width: 32px; height: 32px; flex: none; border-radius: 10px; background: linear-gradient(135deg, var(--navy), var(--emerald)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.ai-msg .bubble { background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 12px 15px; font-size: 13.5px; max-width: 86%; }
.ai-msg.me { flex-direction: row-reverse; }
.ai-msg.me .bubble { background: linear-gradient(135deg, rgba(37,99,235,.12), rgba(16,185,129,.1)); border-radius: 16px 4px 16px 16px; }
.ai-msg.me .av { background: var(--line-2); color: var(--muted); }
.ai-input { display: flex; gap: 10px; margin-top: 12px; }

/* heatmap */
.heatmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 5px; }
.hm-cell { aspect-ratio: 1; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: rgba(255,255,255,.9); transition: transform .12s; cursor: default; }
.hm-cell:hover { transform: scale(1.15); }

/* invoice sheet */
.sheet { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 26px; max-width: 760px; margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--navy); padding-bottom: 16px; margin-bottom: 18px; }
.sheet .big { font-size: 20px; font-weight: 800; }

/* badges on avatar in auth cards etc */
.role-chip { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 2px 9px; border-radius: 20px; }
.role-chip.super_admin { background: linear-gradient(90deg,#6D28D9,#8B5CF6); color: #fff; }
.role-chip.admin { background: rgba(37,99,235,.14); color: var(--brand-2); }
.role-chip.accountant { background: rgba(16,185,129,.14); color: #047857; }
.role-chip.contractor { background: rgba(245,158,11,.16); color: #B45309; }
.role-chip.painter { background: rgba(139,92,246,.14); color: #6D28D9; }
.role-chip.monthly { background: rgba(14,165,233,.14); color: #0369A1; }
.role-chip.daily { background: var(--line-2); color: var(--muted); }

/* responsive */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .auth-left { display: none; }
}
@media (max-width: 900px) {
  .sidebar { transform: translateX(-102%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .main { margin-left: 0; }
  .menu-btn { display: flex; }
  .grid-2 { grid-template-columns: 1fr; }
  .palette-btn { display: none; }
  .topbar { padding: 0 14px; }
  .content { padding: 18px 14px 80px; }
  .user-chip b, .user-chip small { display: none; }
  .notif-panel { right: 10px; left: 10px; width: auto; }
}
.bottom-nav { display: none; }

@media (max-width: 640px) {
  .content { padding-bottom: 120px; }
  .grid-4, .grid-3 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .page-head h1 { font-size: 19px; }
  .auth-card { padding: 24px 18px; }
  .kpi .k-value { font-size: 20px; }
  .toast { min-width: 0; width: calc(100vw - 24px); }
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 45; height: 62px;
    display: flex; background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--line);
  }
  .bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 9.5px; font-weight: 600; color: var(--muted); }
  .bottom-nav button.active { color: var(--brand-2); }
  .bottom-nav .icon { font-size: 21px; }
}

/* misc */
.muted { color: var(--muted); }
.small { font-size: 12px; }
.bold { font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.hidden { display: none !important; }
.text-right { text-align: right; }
.mono { font-variant-numeric: tabular-nums; }
.divider-v { width: 1px; align-self: stretch; background: var(--line); }
.static-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.static-tabs button { padding: 9px 15px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.static-tabs button.active { color: var(--brand-2); border-color: var(--brand-2); }
.static-tabs button:hover { color: var(--ink); }
.chart-box { position: relative; width: 100%; }
.chart-box canvas { width: 100%; display: block; }
.stat-delta { font-size: 12px; font-weight: 700; }
.stat-delta.pos { color: var(--green); } .stat-delta.neg { color: var(--red); }

/* ============================================================
   V3 — 3D PREMIUM THEME (UI UX Pro Max: styles #5 + #55 + #64)
   Furniture & Electronics · Liquid Glass · 3D Depth · Gold
   ============================================================ */
:root {
  --bg: #F6F4F0;
  --bg-2: #FFFFFF;
  --ink: #1C1917;
  --ink-2: #44403C;
  --muted: #78716C;
  --line: #E7E5E4;
  --line-2: #F1EFEC;
  --brand: #1C1917;
  --brand-2: #A16207;
  --green: #059669;
  --amber: #D97706;
  --red: #DC2626;
  --violet: #7C3AED;
  --gold: #C9A227;
  --cream: #FAF7F2;
  --font: 'Nunito Sans', 'Inter', system-ui, sans-serif;
  --font-display: 'Rubik', 'Nunito Sans', system-ui, sans-serif;
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px;
  --shadow-sm: 0 1px 2px rgba(28,25,23,.06), 0 2px 6px rgba(28,25,23,.05);
  --shadow-md: 0 10px 30px -12px rgba(28,25,23,.22), 0 4px 10px rgba(28,25,23,.06);
  --shadow-lg: 0 30px 60px -20px rgba(28,25,23,.35), 0 10px 24px -8px rgba(28,25,23,.18);
  --shadow-3d: 0 2px 4px rgba(28,25,23,.18), 0 12px 28px -6px rgba(28,25,23,.28), 0 34px 60px -18px rgba(28,25,23,.35);
  --glass: rgba(255,255,255,.66);
  --glass-border: rgba(255,255,255,.8);
}
[data-theme="dark"] {
  --bg: #0C0A09;
  --bg-2: #1C1917;
  --ink: #FAFAF9;
  --ink-2: #D6D3D1;
  --muted: #A8A29E;
  --line: rgba(214,211,209,.16);
  --line-2: rgba(214,211,209,.09);
  --brand: #E3B341;
  --brand-2: #F5C542;
  --green: #34D399;
  --amber: #FBBF24;
  --red: #F87171;
  --violet: #A78BFA;
  --gold: #F5C542;
  --cream: #14110E;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 12px 32px -10px rgba(0,0,0,.6);
  --shadow-lg: 0 34px 70px -18px rgba(0,0,0,.75);
  --glass: rgba(28,25,23,.6);
  --glass-border: rgba(214,211,209,.16);
}
h1,h2,h3,h4,.display { font-family: var(--font-display); }
body { font-family: var(--font); }

/* cursor + focus per UXPM checklist */
button, [role="button"], a, .nav-item, .chip, .bio-card, .tree-item, [data-pal] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 6px; }

/* ---------- 3D depth orbs (background layers) ---------- */
.depth-stage { position: relative; overflow: hidden; }
.orb3d { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; will-change: transform; }
.orb3d.gold { background: radial-gradient(circle at 30% 30%, #F5C542, #A16207 70%); }
.orb3d.green { background: radial-gradient(circle at 30% 30%, #34D399, #059669 70%); }
.orb3d.violet { background: radial-gradient(circle at 30% 30%, #A78BFA, #6D28D9 70%); }
.orb3d.blue { background: radial-gradient(circle at 30% 30%, #7DD3FC, #0369A1 70%); }
.orb3d.rose { background: radial-gradient(circle at 30% 30%, #FBCFE8, #BE123C 70%); }
@keyframes float3d { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(0,-22px,40px) scale(1.06); } }
@keyframes drift { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(30px,-18px,0); } }

/* ---------- 3D tilt cards ---------- */
.tilt3d { transform-style: preserve-3d; transition: transform .18s ease-out, box-shadow .25s ease; will-change: transform; }
.tilt3d .tilt-inner { transform: translateZ(34px); transition: transform .18s ease-out; }
.tilt3d .tilt-float { transform: translateZ(58px); }

/* ---------- VisionOS glass panel ---------- */
.glass3d {
  background: rgba(255,255,255,.5);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,.65);
  box-shadow: 0 8px 32px rgba(28,25,23,.14), inset 0 1px 0 rgba(255,255,255,.7);
  border-radius: 28px;
}
[data-theme="dark"] .glass3d { background: rgba(28,25,23,.5); border-color: rgba(214,211,209,.14); box-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }

/* ---------- 3D product card (showcase) ---------- */
.product3d {
  position: relative; border-radius: 22px; padding: 20px 16px 18px; text-align: center;
  background: linear-gradient(160deg, #FFFFFF, #F7F4EE 55%, #EDE8DE);
  border: 1px solid rgba(28,25,23,.06);
  box-shadow: var(--shadow-3d);
  overflow: hidden; transition: transform .2s ease, box-shadow .25s ease;
}
[data-theme="dark"] .product3d { background: linear-gradient(160deg, #211D1A, #171412 55%, #120F0C); border-color: rgba(214,211,209,.1); }
.product3d .p-glow { position: absolute; inset: -30%; background: radial-gradient(circle at 50% 0%, rgba(201,162,39,.35), transparent 60%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.product3d:hover .p-glow { opacity: 1; }
.product3d .p-stage {
  height: 92px; display: flex; align-items: center; justify-content: center; margin: 4px auto 12px;
  perspective: 600px;
}
.product3d .p-icon {
  font-size: 58px; color: var(--brand-2);
  filter: drop-shadow(0 14px 16px rgba(28,25,23,.35));
  transform: translateZ(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.product3d:hover .p-icon { transform: translateZ(60px) translateY(-4px) scale(1.08); }
.product3d .p-floor {
  width: 64%; height: 12px; margin: 0 auto; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(28,25,23,.28), transparent 70%);
  filter: blur(3px); transition: .3s;
}
.product3d:hover .p-floor { width: 80%; opacity: .8; }
.product3d b { font-family: var(--font-display); font-size: 14.5px; display: block; margin-top: 4px; }
.product3d small { color: var(--muted); font-size: 11.5px; }
.product3d .p-badge { position: absolute; top: 12px; right: 12px; }

/* ---------- 3D hero (login) ---------- */
.hero3d {
  perspective: 1200px;
  position: relative;
  margin-top: 26px;
  padding-top: 8px;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 560px;
}
.hero3d .h-card {
  border-radius: 16px; padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 14px 30px -12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28);
  color: #fff; font-weight: 700; font-size: 12.5px; font-family: var(--font-display);
  width: 100%;
  animation: floatcard 5.5s ease-in-out infinite;
}
@keyframes floatcard {
  0%, 100% { transform: translate3d(0,0,0); }
  50% { transform: translate3d(0,-5px,0); }
}
.hero3d .h-card .icon { font-size: 30px; color: var(--gold); }
.hero3d .h-card small { display: block; font-weight: 500; color: rgba(255,255,255,.75); font-size: 11px; }

/* ---------- login left panel v3 ---------- */
.auth-left {
  background:
    radial-gradient(1000px 600px at 85% -10%, rgba(201,162,39,.32), transparent 60%),
    radial-gradient(800px 500px at -10% 105%, rgba(5,150,105,.25), transparent 55%),
    linear-gradient(155deg, #17130F, #2A2118 55%, #17130F);
}
.auth-left::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 46px 46px;
  transform: perspective(600px) rotateX(55deg) translateY(22%);
  transform-origin: bottom;
  mask-image: linear-gradient(to top, #000 30%, transparent 85%);
}
.auth-hero h2 { font-size: 40px; line-height: 1.14; }
.auth-hero h2 span {
  background: linear-gradient(100deg, #F5C542, #FDE68A 45%, #C9A227);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.auth-brand .logo { background: linear-gradient(135deg, #C9A227, #F5C542); color: #1C1917; }

/* ---------- buttons v3 ---------- */
.btn-primary { background: linear-gradient(135deg, #B45309, #D97706 55%, #C9A227); color: #fff; box-shadow: 0 8px 22px -8px rgba(201,162,39,.7); }
.btn-primary:hover { box-shadow: 0 12px 30px -8px rgba(201,162,39,.9), 0 0 0 1px rgba(255,255,255,.2) inset; }
[data-theme="dark"] .btn-primary { background: linear-gradient(135deg, #E3B341, #F5C542); color: #1C1917; box-shadow: 0 8px 24px -8px rgba(245,197,66,.5); }
.btn-green { background: linear-gradient(135deg, #047857, #059669); }
.kpi .k-icon.green { background: rgba(5,150,105,.12); color: var(--green); }
.kpi .k-icon.blue { background: rgba(161,98,7,.12); color: #A16207; }
.kpi .k-icon.violet { background: rgba(124,58,237,.12); color: var(--violet); }

.card { border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.card.hover:hover { transform: translateY(-3px) translateZ(0); box-shadow: var(--shadow-md); }

[data-theme="dark"] .sidebar { background: rgba(28,25,23,.72); }
.topbar { background: rgba(255,255,255,.66); }
[data-theme="dark"] .topbar { background: rgba(12,10,9,.66); }
.nav-item.active { background: linear-gradient(90deg, rgba(201,162,39,.16), rgba(201,162,39,.05)); color: #A16207; }
[data-theme="dark"] .nav-item.active { color: #F5C542; }
.sidebar-head .logo { background: linear-gradient(135deg, #B45309, #C9A227); box-shadow: 0 8px 20px -6px rgba(201,162,39,.6); }

/* auth card glass */
.auth-card { background: rgba(255,255,255,.78); -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%); }
[data-theme="dark"] .auth-card { background: rgba(28,25,23,.72); }
.avatar { background: linear-gradient(135deg, #B45309, #C9A227); }
.avatar.green { background: linear-gradient(135deg,#047857,#10B981); }
.avatar.violet { background: linear-gradient(135deg,#6D28D9,#8B5CF6); }
.avatar.amber { background: linear-gradient(135deg,#B45309,#F59E0B); }

/* product grid on dashboard */
.showcase-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }

/* demo tip */
.open-tip {
  margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 12px; color: #92400E;
  background: rgba(201,162,39,.12); border: 1px solid rgba(201,162,39,.3);
}
[data-theme="dark"] .open-tip { color: #FDE68A; }

/* reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .tilt3d, .product3d .p-icon, .orb3d, .hero3d .h-card { transform: none !important; }
}

/* ============================================================
   V4 — LAYOUT RESTRUCTURE (structure, breathing room, mobile)
   ============================================================ */

/* ---------- section headers between dashboard blocks ---------- */
.sec-head { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
.sec-head .s-ic {
  width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(201,162,39,.2), rgba(201,162,39,.08)); color: #A16207; font-size: 19px;
}
[data-theme="dark"] .sec-head .s-ic { color: #F5C542; }
.sec-head h3 { font-size: 16.5px; font-weight: 700; }
.sec-head small { color: var(--muted); font-size: 12.5px; }
.sec-head .spacer { flex: 1; }

/* ---------- KPI grid that wraps nicely at every size ---------- */
.kpi-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
@media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
@media (max-width: 380px) { .kpi-grid { grid-template-columns: 1fr; } }

/* ---------- showroom: horizontal swipe on mobile ---------- */
@media (max-width: 720px) {
  .showcase-strip {
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 12px;
    padding-bottom: 12px; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
  }
  .showcase-strip .product3d { flex: 0 0 148px; scroll-snap-align: start; }
  .showcase-strip .product3d .p-stage { height: 74px; }
  .showcase-strip .product3d .p-icon { font-size: 44px; }
}

/* ---------- hide hero showcase on narrow screens ---------- */
@media (max-width: 1100px) { .hero3d { display: none; } }

/* ---------- compact, structured login card ---------- */
.auth-card { padding: 26px 26px 24px; }
.auth-card h3 { font-size: 20px; }
.demo-toggle {
  width: 100%; margin-top: 14px; padding: 10px 14px; border-radius: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(201,162,39,.1); border: 1px solid rgba(201,162,39,.3); color: #92400E;
  font-weight: 700; font-size: 13px; transition: .18s;
}
[data-theme="dark"] .demo-toggle { color: #FDE68A; }
.demo-toggle:hover { background: rgba(201,162,39,.18); }
.demo-toggle .chev { transition: transform .25s; }
.demo-toggle.open .chev { transform: rotate(180deg); }
.demo-box { max-height: 0; overflow: hidden; padding: 0 14px; margin-top: 0; opacity: 0; transition: max-height .3s ease, padding .3s, opacity .3s, margin .3s; }
.demo-box.open { max-height: 380px; overflow-y: auto; padding: 12px 14px; margin-top: 12px; opacity: 1; }
.diag-line { margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; }
.open-tip { margin-top: 12px; padding: 9px 12px; border-radius: 12px; font-size: 11.5px; color: #92400E; background: rgba(201,162,39,.1); border: 1px solid rgba(201,162,39,.28); }
[data-theme="dark"] .open-tip { color: #FDE68A; }

/* ---------- content breathing room ---------- */
.content { padding: 26px 30px 70px; }
@media (max-width: 900px) { .content { padding: 20px 16px 90px; } }
.mt-32 { margin-top: 32px; }

/* ---------- compact sidebar on shorter screens ---------- */
@media (max-height: 850px) {
  .nav-item { padding: 7px 10px; font-size: 13px; }
  .nav-item .icon { font-size: 18px; }
  .sidebar-section { padding: 10px 10px 4px; }
  .sidebar-head { padding: 14px 16px 10px; }
}

/* ---------- compact login on small phones ---------- */
@media (max-width: 640px) {
  .auth-card { padding: 20px 18px 16px; }
  .field { margin-bottom: 11px; }
  .divider { margin: 12px 0; }
  .bio-card { padding: 9px 6px; }
  .bio-card .icon { font-size: 22px; margin-bottom: 4px; }
  .bio-card b { font-size: 11.5px; }
  .demo-toggle { margin-top: 10px; padding: 8px 10px; font-size: 12px; }
  .open-tip { font-size: 10.5px; padding: 8px 10px; }
  .diag-line { display: none; }
  .auth-hero h2 { font-size: 30px; }
  .auth-stats div b { font-size: 18px; }
}

/* ============================================================
   3D ANIMATION SYSTEM (v6) — login scene + burst navigation
   ============================================================ */

/* ---------- login: gold particles ---------- */
.gold-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

/* ---------- login: 3D orbiting product ring ---------- */
.orbit-ring {
  position: absolute; left: 50%; top: 55%; z-index: 3;
  width: 0; height: 0;
  transform-style: preserve-3d;
  animation: ringSpin 34s linear infinite;
  pointer-events: none;
}
@keyframes ringSpin { from { transform: rotateX(12deg) rotateY(0); } to { transform: rotateX(12deg) rotateY(360deg); } }
.orbit-card {
  position: absolute; left: 0; top: 0; width: 108px; margin-left: -54px; margin-top: -54px;
  height: 108px; border-radius: 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
  box-shadow: 0 24px 44px -14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
  color: #fff; font-family: var(--font-display);
  transform: rotateY(calc(var(--i) * 360deg / var(--n))) translateZ(300px);
  transform-style: preserve-3d;
  will-change: transform;
}
.orbit-card .icon { font-size: 38px; color: #F5C542; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
.orbit-card b { font-size: 12px; font-weight: 700; }
.orbit-card::after {
  content: ""; position: absolute; bottom: -34px; left: 50%; width: 90px; height: 16px; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%); filter: blur(4px); border-radius: 50%;
}
/* center core */
.orbit-core {
  position: absolute; left: 50%; top: 55%; z-index: 2; transform: translate(-50%, -50%);
  width: 150px; height: 150px; margin-left: -75px; margin-top: -75px;
  border-radius: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: linear-gradient(140deg, rgba(201,162,39,.28), rgba(28,25,23,.55));
  border: 1px solid rgba(245,197,66,.55);
  box-shadow: 0 0 70px rgba(245,197,66,.5), 0 30px 60px -18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  color: #fff; text-align: center; font-family: var(--font-display);
  will-change: transform;
}
.orbit-core .icon { font-size: 40px; color: #F5C542; }
.orbit-core b { font-size: 15px; font-weight: 800; letter-spacing: .02em; }
.orbit-core small { font-size: 9.5px; color: rgba(255,255,255,.75); }

/* ---------- burst navigation transition ---------- */
.burst3d {
  position: fixed; inset: 0; z-index: 200; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.burst-backdrop {
  position: absolute; inset: 0; background: radial-gradient(900px 500px at 50% 40%, rgba(201,162,39,.16), rgba(12,10,9,.92) 70%);
  animation: burstIn .25s ease;
}
.burst-stage { position: relative; width: 0; height: 0; perspective: 900px; }
.burst-parent {
  position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin-left: -48px; margin-top: -48px;
  border-radius: 30px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #B45309, #C9A227); color: #fff;
  box-shadow: 0 0 90px rgba(245,197,66,.85), 0 30px 60px -18px rgba(0,0,0,.6);
  animation: burstParent .75s cubic-bezier(.2,.8,.2,1);
}
.burst-parent .icon { font-size: 48px; }
.burst-kid {
  position: absolute; left: 0; top: 0; width: 66px; height: 66px; margin-left: -33px; margin-top: -33px;
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.35);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 20px 40px -14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3);
  color: #F5C542;
  opacity: 0; transform: translate3d(0,0,0) scale(.2);
  animation: burstFly 1.05s cubic-bezier(.2,.8,.2,1) forwards;
  will-change: transform, opacity;
}
.burst-kid .icon { font-size: 30px; }
.burst-title {
  position: absolute; left: 0; top: 90px; width: max-content; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -.02em;
  color: #F5C542; text-shadow: 0 6px 30px rgba(0,0,0,.6), 0 0 40px rgba(245,197,66,.4);
  opacity: 0; animation: burstTitle .5s ease .5s forwards;
  white-space: nowrap;
}
@keyframes burstParent {
  0% { transform: scale(.3); opacity: 0; }
  55% { transform: scale(1.25); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes burstFly {
  0% { opacity: 0; transform: translate3d(0,0,0) scale(.2); }
  18% { opacity: 1; transform: translate3d(0,0,60px) scale(1); }
  100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), var(--dz)) rotateY(var(--rot)) scale(.9); }
}
@keyframes burstTitle { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.burst3d.burst-out .burst-backdrop { animation: burstOut .4s ease forwards; }
@keyframes burstOut { to { opacity: 0; } }
@keyframes burstIn { from { opacity: 0; } }

/* smaller ring on mid screens */
@media (max-width: 1500px) and (min-width: 1101px) {
  .orbit-card { transform: rotateY(calc(var(--i) * 360deg / var(--n))) translateZ(230px); }
}
@media (prefers-reduced-motion: reduce) {
  .orbit-ring, .orbit-card, .orbit-core, .gold-canvas, .burst3d { display: none !important; }
  .burst3d { pointer-events: none; }
}

  DB.stockMovements = [];

  DB.workSubmissions = [];
  DB.notificationsSeq = 1000;
  DB.idSeq = { invoice: 2000, user: 200, item: 200, material: 200, order: 100, customer: 100, payment: 100 };

  function findUserByEmail(email) {
    return (DB.users || []).find(u => u.email.toLowerCase() === String(email).toLowerCase());
  }
  function userIdOf(email) {
    const u = findUserByEmail(email);
    return u ? String(u.id) : null;
  }
  function roleOf(email) {
    const u = findUserByEmail(email);
    return u ? u.role : null;
  }
  function notifsFor(email) {
    const uid = userIdOf(email);
    return DB.notifications[uid] || [];
  }

  function computeKpis(role, email) {
    const k = JSON.parse(JSON.stringify(M.kpis[role] || {}));
    const uid = Number(userIdOf(email));
    if (role === 'contractor' || role === 'painter') {
      const mine = DB.workOrders.filter(w => w.assigned_to === uid);
      k.my_orders = mine.length;
      k.my_pending = mine.filter(w => w.status === 'todo' || w.status === 'in_progress').length;
      k.my_payments = DB.payments.filter(p => p.user_id === uid && p.status === 'paid').reduce((s, p) => s + p.amount, 0);
    }
    if (role === 'monthly' || role === 'daily') {
      k.my_attendance = 22;
    }
    k.pending_approvals = DB.categories.filter(c => c.status === 'pending').length;
    return k;
  }

  const _route = (path, method, body, session) => {
    const email = session ? session.user.email : '';
    const uid = userIdOf(email);
    const role = session ? session.user.role : '';
    const seg = path.split('?')[0];
    const qs = new URLSearchParams(path.split('?')[1] || '');
    const base = seg.replace('/api', '');

    // ---------- AUTH ----------
    if (base === '/auth/login') {
      const u = findUserByEmail(body.email);
      if (!u) return [401, { detail: 'Invalid email or password' }];
      if (u.status !== 'active') return [403, { detail: 'Account suspended' }];
      return [200, { otp_required: true, message: 'OTP sent to your registered email/phone.', dev_otp: '123456' }];
    }
    if (base === '/auth/otp-verify') {
      if (String(body.code) !== '123456' && String(body.code) !== (body.dev_otp || '')) {
        return [400, { detail: 'Incorrect OTP code' }];

      const u = findUserByEmail(body.email);
      return [200, { access_token: 'demo.' + btoa(JSON.stringify({ sub: u.id, role: u.role, typ: 'access' })), refresh_token: 'demo-refresh', token_type: 'bearer', expires_in: 1800, user: u }];

    if (base === '/auth/forgot-password') return [200, { message: 'If that email exists, an OTP has been sent.', dev_otp: '123456' }];
    if (base === '/auth/reset-password') return String(body.code) === '123456' ? [200, { ok: true }] : [400, { detail: 'Incorrect OTP code' }];
    if (base === '/auth/me') return [200, session.user];
    if (base === '/auth/sessions') return [200, DB.sessions];
    if (base === '/auth/devices') return [200, DB.devices];
    if (base === '/auth/history') return [200, DB.loginHistory];
    if (base === '/auth/2fa/toggle') return [200, { ok: true, enabled: !!body.enabled }];
    if (base === '/auth/biometrics/enroll') return [200, { ok: true, kind: body.kind }];
    if (base === '/auth/biometrics/verify') return [200, { ok: true, kind: body.kind }];

      const nu = { id: DB.idSeq.user++, name: body.name, email: body.email, role: body.role, status: 'active', designation: '', department: '', monthly_salary: +body.monthly_salary || 0, daily_rate: +body.daily_rate || 0, two_factor_enabled: 0, face_id_enabled: 0, fingerprint_enabled: 0 };
      DB.users.push(nu);
      return [200, { ok: true, id: nu.id }];
    }

    // ---------- ADMIN ----------
    if (base === '/users') {
      if (method === 'GET') return [200, DB.users];
      if (method === 'POST') {
        if (DB.users.some(u => u.email === body.email)) return [409, { detail: 'Email already registered' }];
        const nu = { id: DB.idSeq.user++, name: body.name, email: body.email, role: body.role, status: 'active', designation: body.designation || '', department: body.department || '', monthly_salary: +body.monthly_salary || 0, daily_rate: +body.daily_rate || 0 };
        DB.users.push(nu);
        return [200, { ok: true, id: nu.id }];
      }
    }
    let m = base.match(/^\/users\/(\d+)\/suspend$/); if (m && method === 'POST') {

      localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
    } catch (e) { /* storage full / blocked — keep running in memory */ }

  function restore() {
    try {

<script>
/* Vinosheel ERP — 3D animation engine.
   Two systems (pure CSS 3D + canvas — no external libraries):

   1) loginScene3D(container) — a premium "worth 10 lakhs" login scene:
      an orbiting 3D product ring (glass cards rotating in perspective),
      a gold particle field (canvas), mouse parallax, shine sweeps.

   2) burstTo(route, onDone) — the product-emergence transition:
      a parent icon for the page explodes into page-specific product
      icons (sofas, ACs, fridges, beds...) that fly out in 3D before
      the next screen renders.

   Respects prefers-reduced-motion. Kept under ~60fps: transforms only.
*/
(function () {
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------------------------------------------------------- routes
  const PAGE_BURST = {
    dashboard: { icon: 'dashboard_customize', title: 'Command Centre', kids: ['auto_awesome', 'inventory_2', 'payments', 'monitoring', 'groups', 'fact_check'] },
