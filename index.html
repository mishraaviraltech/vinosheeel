          <p>Bill to: <b>${esc(inv0.customer_name)}</b></p>
          <table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
          <tbody>${inv0.items.map(it => `<tr><td>${esc(it.product)}</td><td>${it.qty}</td><td>₹${it.price}</td><td>₹${it.qty * it.price}</td></tr>`).join('')}</tbody>
          <tr class="tot"><td colspan="3">Total</td><td>₹${inv0.total}</td></tr></table>`);

          const box = el.querySelector('[data-c]');

          else if (Array.isArray(chartData.data)) Charts.bar(box, chartData.data.map(d => ({ label: d.name, value: d.value })));
        }, 60);
      };
      add(`Hello ${me.name.split(' ')[0]}! I have live access to sales, inventory, materials, attendance & payroll. Try the examples below. 🚀`, false);
      const ask = async q => {
        add(q, true);
        const { data } = await API.get('/api/ai/query?q=' + encodeURIComponent(q));
        add(data.answer || 'Here you go.', false, data);
      };
      ['Predict next month sales', 'Which contractor performed best?', 'What material should we buy next week?', 'How many Sheesham beds were sold this month?'].forEach(q => {
        const chip = document.createElement('button');
        chip.className = 'chip mt-8';
        chip.style.marginRight = '8px';
        chip.innerHTML = '<span class="icon material-symbols-outlined">spark</span>' + esc(q);
        chip.onclick = () => ask(q);
        chat.appendChild(chip);
      });
      container.querySelector('[data-form]').onsubmit = e => {
        e.preventDefault();
        const inp = container.querySelector('[data-in]');
        if (inp.value.trim()) { ask(inp.value.trim()); inp.value = ''; }
      };
    });
  };
})();

</script>

  }
  function notifIcon(t) {
    return { approval: 'fact_check', inventory: 'inventory_2', work: 'construction', payment: 'payments', invoice: 'receipt_long', attendance: 'event_available', payroll: 'payments', account: 'manage_accounts', system: 'info', role: 'manage_accounts' }[t] || 'notifications';
  }
  function notifColor(t) { return { approval: 'rgba(245,158,11,.15)', payment: 'rgba(16,185,129,.14)', inventory: 'rgba(37,99,235,.12)', work: 'rgba(139,92,246,.13)', invoice: 'rgba(37,99,235,.12)' }[t] || 'var(--line-2)'; }
  function notifFg(t) { return { approval: '#B45309', payment: '#047857', inventory: '#1D4ED8', work: '#6D28D9', invoice: '#1D4ED8' }[t] || 'var(--muted)'; }

  function userMenu(anchor) {
    const m = UI.menu(anchor, [
      { id: 'profile', label: 'My profile', icon: 'person' },
      { id: 'security', label: 'Security & devices', icon: 'verified_user' },
      { id: 'sep' },
      { id: 'theme', label: 'Toggle dark / light', icon: 'dark_mode' },
      { id: 'reset', label: 'Reset demo data', icon: 'restart_alt' },
      { id: 'logout', label: 'Sign out', icon: 'logout', danger: true },
    ]);
    m.onAction(act => {
      if (act === 'logout') window.VinosheelApp.exit();
      if (act === 'theme') toggleTheme();
      if (act === 'profile') window.VinosheelApp.go('/profile');
      if (act === 'security') window.VinosheelApp.go('/security');
      if (act === 'reset') {
        UI.confirmDlg({ title: 'Reset demo data?', msg: 'All your saved changes (employees, products, invoices…) will be erased and the original demo data restored.', danger: true, okText: 'Reset', onOk: () => { if (window.VinosheelMock && window.VinosheelMock.resetDemo) window.VinosheelMock.resetDemo(); } });
      }
    });
  }

  // ------------------------------------------------------------------ router
  function go(route) {
    route = String(route || 'dashboard').replace(/^#?\/?/, '');
    const user = API.session().user;
    const view = $('#view');
    const crumb = $('#crumb-route');
    if (crumb) crumb.textContent = ROUTE_TITLES[route] || route;
    document.querySelectorAll('[data-nav]').forEach(n => n.classList.toggle('active', n.dataset.nav === route));
    window.scrollTo(0, 0);

    const render = () => {
      view.innerHTML = '';
      if (route === 'register') return VinosheelAuth.showRegister();
      if (route === 'security') return VinosheelAuth.securityScreen();
      if (route === 'profile') return profileView(view);

      // Route-level authorization: only render pages the role is allowed to see.
      const navIds = (NAV[user.role] || []).filter(n => n.id).map(n => n.id);
      if (route !== 'dashboard' && !navIds.includes(route)) {
        view.innerHTML = UI.emptyState('lock', 'Restricted area',
          'Your role (' + user.role.replace(/_/g, ' ') + ') does not have access to this page. Ask an Admin to assign the right role.');
        return;
      }

      const fn = window.Views[route];
      if (!fn) return view.innerHTML = UI.emptyState('map', 'Page not found', route);
      try {
        fn(view);
      } catch (e) {
        console.error('View failed:', route, e);
        view.innerHTML = UI.emptyState('error', 'Something went wrong', e.message || 'Please try again');
      }
    };

    if (window.Anim3D) window.Anim3D.burstTo(route, render);
    else render();
  }

  function profileView(view) {
    const u = API.session().user;
    view.innerHTML = `
    <div class="page-head"><div><h1>My profile</h1><p>Your role, permissions & personal settings.</p></div></div>
    <div class="grid grid-2">
      <div class="card card-pad" style="text-align:center">
        <span class="avatar ${UI.avatarColor(u.name)}" style="width:72px;height:72px;font-size:26px;margin:0 auto">${UI.initials(u.name)}</span>
        <h3 class="mt-16">${esc(u.name)}</h3>
        <div class="mt-8">${UI.roleChip(u.role)}</div>
        <p class="muted small mt-8">${esc(u.email)}${u.phone ? ' · ' + esc(u.phone) : ''}</p>
        <div class="row mt-16" style="justify-content:center;gap:8px">
          <button class="btn btn-ghost btn-sm" data-sec><span class="icon material-symbols-outlined">verified_user</span> Security</button>
          <button class="btn btn-ghost btn-sm" data-th><span class="icon material-symbols-outlined">dark_mode</span> Theme</button>
        </div>
      </div>
      <div class="card"><div class="card-head"><span class="icon material-symbols-outlined">admin_panel_settings</span><h3>My permissions</h3></div>
        <div class="card-pad">
          ${(window.VinosheelPerms || permList(u.role)).map(p => `
            <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line-2)">
              <span class="small">${esc(p)}</span><span class="pill green">allowed</span>
            </div>`).join('')}
        </div></div>
    </div>`;
    view.querySelector('[data-sec]').onclick = () => window.VinosheelApp.go('/security');
    view.querySelector('[data-th]').onclick = () => toggleTheme();
  }

  function permList(role) {
    const map = {
      super_admin: ['View every record', 'Hidden audit logs', 'Restore deleted records', 'Backups & restore', 'Bypass approvals', 'Edit anything'],
      admin: ['Employee management', 'Inventory approvals', '5-day finance edits', 'Attendance override', 'Payroll & payments', 'AI dashboard'],
      accountant: ['Inventory add/edit', 'GST billing', 'Customer & supplier DB', 'Expenses', 'AI insights', 'Cash flow'],
      contractor: ['View assigned orders', 'Submit completed work', 'Consume workshop material', 'Payment history', 'AI summary'],
      painter: ['Submit painted work', 'Consume paint/polish only', 'Payment history', 'AI summary'],
      monthly: ['View attendance', 'Payslips', 'Leave balance', 'Notifications'],
      daily: ['View attendance', 'Payment history', 'Notifications'],
    };
    return map[role] || [];
  }

  // ------------------------------------------------------------ palette
  function openPalette() {
    const user = API.session().user;
    const items = Object.entries(ROUTE_TITLES)
      .filter(([r]) => NAV[user.role].some(n => n.id === r))
      .map(([r, t]) => ({ route: r, title: t, icon: navIcon(r) }));
    const root = $('#palette-root');
    root.innerHTML = `
    <div class="palette">
      <div class="palette-box">
        <div class="palette-search"><span class="icon material-symbols-outlined">search</span>
          <input placeholder="Search pages & actions…" data-pal-in autocomplete="off" />
          <kbd style="font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px">esc</kbd></div>
        <div class="palette-list" data-pal-list></div>
      </div>
    </div>`;
    const list = root.querySelector('[data-pal-list]');
    const render = () => {
      const q = (root.querySelector('[data-pal-in]').value || '').toLowerCase();
      const res = items.filter(i => !q || i.title.toLowerCase().includes(q) || i.route.includes(q));
      list.innerHTML = res.map((i, k) => `
        <div class="palette-item ${k === 0 ? 'sel' : ''}" data-pal="${i.route}">
          <span class="icon material-symbols-outlined">${esc(i.icon)}</span>
          <div><b>${esc(i.title)}</b><small> ${esc(i.route)}</small></div>
        </div>`).join('') || '<div class="empty">No matches</div>';
      list.querySelectorAll('[data-pal]').forEach(el => el.onclick = () => { close(); window.VinosheelApp.go(el.dataset.pal); });
    };
    render();
    const inp = root.querySelector('[data-pal-in]');
    inp.focus();
    inp.oninput = render;
    inp.onkeydown = e => {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter') { const sel = list.querySelector('.sel'); if (sel) { close(); window.VinosheelApp.go(sel.dataset.pal); } }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const all = [...list.querySelectorAll('[data-pal]')];
        const idx = all.findIndex(x => x.classList.contains('sel'));
        all.forEach(x => x.classList.remove('sel'));
        const next = (idx + (e.key === 'ArrowDown' ? 1 : -1) + all.length) % all.length;
        all[next] && all[next].classList.add('sel');
        e.preventDefault();
      }
    };
    function close() { root.innerHTML = ''; }
    root.querySelector('.palette').addEventListener('mousedown', e => { if (e.target.classList.contains('palette')) close(); });
  }

  function navIcon(route) {
    return { dashboard: 'dashboard', users: 'groups', approvals: 'fact_check', inventory: 'inventory_2', stock: 'swap_vert', materials: 'forest', work: 'construction', payments: 'payments', attendance: 'event_available', payroll: 'payments', sales: 'receipt_long', customers: 'groups', suppliers: 'local_shipping', catalogue: 'photo_library', finance: 'account_balance', reports: 'monitoring', ai: 'auto_awesome', audit: 'manage_search', backup: 'backup', company: 'apartment', security: 'verified_user', exports: 'download', register: 'person_add', profile: 'person' }[route] || 'chevron_right';
  }

  window.VinosheelApp = { enter, go, exit: () => { API.setSession(null); VinosheelAuth.showLogin(); }, openPalette, toggleTheme };
  window.VinosheelPerms = null;
})();

</script>
<script>
/* Vinosheel Trading ERP — bootstrap. */
(function () {
  // surface unhandled errors as toasts instead of silent breakage
  window.addEventListener('unhandledrejection', e => {
    console.error('Unhandled rejection:', e.reason);
    const msg = (e.reason && e.reason.message) || 'Something went wrong';
    if (window.UI) window.UI.toast('err', 'Something went wrong', msg);
    e.preventDefault();
  });
  window.addEventListener('error', e => {
    if (window.UI) window.UI.toast('err', 'Unexpected error', e.message || 'Please try again');
  });

  // keyboard shortcuts
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (API.session()) window.VinosheelApp.openPalette();
    }
  });

  function boot() {
    const s = API.session();
    if (s && s.user) {
      // restore theme
      document.documentElement.dataset.theme = window.__themeGet ? window.__themeGet() : localStorage.getItem('vinosheel-theme') || 'light';
      window.VinosheelApp.enter(s.user);
    } else {
      window.VinosheelAuth.showSplash();
    }
  }

  window.addEventListener('hashchange', () => {
    if (!API.session()) return;
    window.VinosheelApp.go(location.hash.replace('#/', ''));
  });

  boot();
})();

</script>
</body>
</html>
