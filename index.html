    return `<div class="card">
      <div class="card-head"><span class="icon material-symbols-outlined">${esc(icon)}</span><h3>${esc(title)}</h3>${extra}</div>
      <div class="card-pad chart-box" id="${chartId}"></div>
    </div>`;
  }

  const AI_SUGGEST = [
    'How many Sheesham beds were sold this month?',
    'Which contractor performed best?',
    'What material should we buy next week?',
    'Predict next month sales',
  ];

  function aiCard() {
    return `<div class="card">
      <div class="card-head"><span class="icon material-symbols-outlined" style="color:var(--green)">auto_awesome</span>
        <h3>AI Business Assistant</h3><span class="pill green">LIVE</span></div>
      <div class="card-pad">
        <div class="row wrap" style="gap:8px">${AI_SUGGEST.map(q => `<button class="chip" data-aiq="${esc(q)}"><span class="icon material-symbols-outlined">spark</span>${esc(q)}</button>`).join('')}</div>
        <div class="ai-chat mt-16" data-aichat></div>
        <form class="ai-input" data-aiform>
          <input class="input grow" placeholder="Ask anything… e.g. profit this month" data-aiin />
          <button class="btn btn-primary" type="submit"><span class="icon material-symbols-outlined">send</span></button>
        </form>
      </div>
    </div>`;
  }

  function bindAi(container) {
    const chat = container.querySelector('[data-aichat]');
    const addMsg = (text, me, chartData) => {
      const el = document.createElement('div');
      el.className = 'ai-msg' + (me ? ' me' : '');
      const av = me ? '<div class="av"><span class="icon material-symbols-outlined">person</span></div>' : '<div class="av"><span class="icon material-symbols-outlined">auto_awesome</span></div>';
      el.innerHTML = av + `<div class="bubble">${esc(text)}${chartData ? `<div class="mt-8 chart-box" data-ai-chart></div>` : ''}</div>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      if (chartData) {
        const box = el.querySelector('[data-ai-chart]');
        setTimeout(() => {
          if (chartData.chart === 'line') Charts.line(box, [{ name: 'Forecast', points: chartData.data.map(d => ({ label: d.date, value: d.value })) }], { labels: true });
          else if (Array.isArray(chartData.data)) Charts.bar(box, chartData.data.map(d => ({ label: d.name, value: d.value })));
        }, 60);
      }
    };
    addMsg('Namaste! I\'m your Vinosheel AI assistant. Ask me anything about sales, materials, contractors or forecasts. 📊', false);
    const ask = async (q) => {
      addMsg(q, true);
      try {
        const { data } = await API.get('/api/ai/query?q=' + encodeURIComponent(q));
        addMsg(data.answer || 'Here you go.', false, data);
      } catch (e) { addMsg('Sorry, I couldn\'t reach the engine. ' + e.message, false); }
    };
    container.querySelectorAll('[data-aiq]').forEach(b => b.onclick = () => ask(b.dataset.aiq));
    container.querySelector('[data-aiform]').onsubmit = e => {
      e.preventDefault();
      const inp = container.querySelector('[data-aiin]');
      if (inp.value.trim()) { ask(inp.value.trim()); inp.value = ''; }
    };
  }

  // 3D showroom strip (furniture + electronics)
  const SHOWROOM = [
    { icon: 'weekend', name: 'Sofas', tag: 'Lounge & living', cat: 'furniture', hot: true },
    { icon: 'bed', name: 'Beds', tag: 'Sheesham · Teak · Mango', cat: 'furniture', hot: true },
    { icon: 'door_sliding', name: 'Wardrobes', tag: 'Custom fit', cat: 'furniture' },
    { icon: 'table_restaurant', name: 'Dining sets', tag: 'Tables & chairs', cat: 'furniture' },
    { icon: 'chair', name: 'Chairs', tag: 'Dining · Office', cat: 'furniture' },
    { icon: 'coffee', name: 'Coffee tables', tag: 'Glass & wood', cat: 'furniture' },
    { icon: 'ac_unit', name: 'Air conditioners', tag: 'Split · Window', cat: 'electronics', hot: true },
    { icon: 'air', name: 'Air coolers', tag: 'Desert · Tower', cat: 'electronics', hot: true },
    { icon: 'local_laundry_service', name: 'Washing machines', tag: 'Front · Top load', cat: 'electronics' },
    { icon: 'kitchen', name: 'Refrigerators', tag: 'Single · Double door', cat: 'electronics' },
    { icon: 'tv', name: 'Televisions', tag: 'Smart 4K', cat: 'electronics' },
    { icon: 'microwave', name: 'Kitchen appliances', tag: 'Microwave · Oven', cat: 'electronics' },
  ];

  function showroomStrip(container) {
    const strip = document.createElement('div');
    strip.className = 'card card-pad depth-stage mt-8';
    strip.innerHTML = `
      <div class="orb3d gold" style="width:300px;height:300px;top:-120px;right:-60px;opacity:.35"></div>
      <div class="orb3d violet" style="width:260px;height:260px;bottom:-110px;left:-50px;opacity:.25"></div>
      <div class="row between mb-8">
        <div><h3 style="font-size:17px">3D Showroom <span class="muted" style="font-weight:500">— everything we sell</span></h3>
        <p class="muted small">Furniture &amp; electronics, one catalogue. Hover / drag to tilt the cards. 🪑❄️</p></div>
        <span class="pill gold" style="background:rgba(201,162,39,.14);color:#A16207">12 lines</span>
      </div>
      <div class="showcase-strip">
        ${SHOWROOM.map((p, i) => `
        <div class="product3d tilt3d" style="animation-delay:${i * .12}s">
          <div class="p-glow"></div>
          ${p.hot ? '<span class="p-badge pill red" style="background:rgba(220,38,38,.12);color:#DC2626">hot</span>' : ''}
          <div class="p-stage"><span class="icon material-symbols-outlined p-icon">${p.icon}</span></div>
          <div class="p-floor"></div>
          <b>${esc(p.name)}</b><small>${esc(p.tag)}</small>
        </div>`).join('')}
      </div>`;
    container.appendChild(strip);
    window.UI.tilt3d(strip);
  }

  // ------------------------------------------------------------- dashboard
  window.Views.dashboard = function (container) {
    const user = API.session().user;
    const role = user.role;
    container.innerHTML = `<div class="grid grid-2">${UI.skeleton(3)}${UI.skeleton(3)}</div>`;
    API.get('/api/dashboard-kpis').then(async ({ data: k }) => {
      container.innerHTML = '';
      const head = `<div class="page-head">
        <div><h1>${esc(roleTitle(role))}</h1>
        <p>${esc(k.greeting || greeting())} Today is <b>${esc(k.today)}</b>. Role: <span class="role-chip ${role}">${role.replace(/_/g, ' ')}</span></p></div>
        <div class="spacer"></div>
        <button class="btn btn-primary" data-go-ai><span class="icon material-symbols-outlined">auto_awesome</span> Ask AI</button>
        <button class="btn btn-ghost" data-new-any>+ New</button>
      </div>`;
      container.insertAdjacentHTML('beforeend', head);

      if (['super_admin', 'admin', 'accountant'].includes(role)) {
        showroomStrip(container);
      }

      container.insertAdjacentHTML('beforeend', secHead('speed', 'Key metrics', 'Live business numbers'));

      if (role === 'super_admin' || role === 'admin') {
        container.insertAdjacentHTML('beforeend', kpiGrid([
          { label: 'Revenue · 30d', value: money(k.revenue_30d), sub: '+12% vs last month', icon: 'payments', color: 'green' },
          { label: 'Pending orders', value: num(k.pending_orders), sub: 'workshop pipeline', icon: 'assignment', color: 'blue' },
          { label: 'Inventory items', value: num(k.inventory_items), sub: k.low_stock + ' below minimum', icon: 'inventory_2', color: 'violet' },
          { label: 'Active employees', value: num(k.active_employees), sub: k.attendance_today + ' present today', icon: 'groups', color: 'amber' },
          { label: 'Outstanding', value: money(k.outstanding), sub: 'receivables to collect', icon: 'account_balance_wallet', color: 'red' },
          { label: 'Pending approvals', value: num(k.pending_approvals), sub: 'categories / products / materials', icon: 'fact_check', color: 'blue' },
          { label: 'Payables pending', value: money(k.payables_pending || 0), sub: 'contractor & painter dues', icon: 'receipt_long', color: 'amber' },
          { label: 'Cash balance', value: money(k.cash_balance || 0), sub: '30d net position', icon: 'savings', color: 'green' },
        ]));
      } else if (role === 'accountant') {
        container.insertAdjacentHTML('beforeend', kpiGrid([
          { label: 'Revenue · 30d', value: money(k.revenue_30d), sub: 'billed & paid', icon: 'payments', color: 'green' },
          { label: 'Outstanding', value: money(k.outstanding), sub: 'follow up on dues', icon: 'schedule_send', color: 'amber' },
          { label: 'Inventory items', value: num(k.inventory_items), sub: k.low_stock + ' low stock', icon: 'inventory_2', color: 'blue' },
          { label: 'Pending approvals', value: num(k.pending_approvals), sub: 'awaiting admin', icon: 'fact_check', color: 'violet' },
        ]));
      } else if (role === 'contractor') {
        container.insertAdjacentHTML('beforeend', kpiGrid([
          { label: 'Assigned orders', value: num(k.my_orders), sub: k.my_pending + ' active now', icon: 'construction', color: 'blue' },
          { label: 'Earned (paid)', value: money(k.my_payments), sub: 'auto-payment by completed work', icon: 'payments', color: 'green' },
          { label: 'Attendance', value: '24', sub: 'days present this month', icon: 'event_available', color: 'amber' },
          { label: 'Performance score', value: '92/100', sub: 'AI estimate · top tier', icon: 'trending_up', color: 'violet' },
        ]));
      } else if (role === 'painter') {
        container.insertAdjacentHTML('beforeend', kpiGrid([
          { label: 'Assigned orders', value: num(k.my_orders), sub: k.my_pending + ' active now', icon: 'brush', color: 'violet' },
          { label: 'Earned (paid)', value: money(k.my_payments), sub: 'auto-payment on submission', icon: 'payments', color: 'green' },
          { label: 'Paint consumed', value: '42 L', sub: 'this month', icon: 'format_color_fill', color: 'blue' },
          { label: 'Efficiency', value: '96%', sub: 'vs. estimate', icon: 'bolt', color: 'amber' },
        ]));
      } else if (role === 'monthly') {
        container.insertAdjacentHTML('beforeend', kpiGrid([
          { label: 'Attendance', value: num(k.my_attendance) + ' days', sub: 'marked this month', icon: 'event_available', color: 'green' },
          { label: 'Last salary', value: money(k.last_salary ? k.last_salary.net : 0), sub: 'July 2026 payslip', icon: 'payments', color: 'blue' },
          { label: 'Leave balance', value: '4.5', sub: 'days remaining', icon: 'beach_access', color: 'amber' },
          { label: 'Performance', value: '88/100', sub: 'workshop score', icon: 'trending_up', color: 'violet' },
        ]));
      } else if (role === 'daily') {
        container.insertAdjacentHTML('beforeend', kpiGrid([
          { label: 'Attendance', value: num(k.my_attendance) + ' days', sub: 'marked this month', icon: 'event_available', color: 'green' },
          { label: 'Earned this month', value: money(k.my_payments || 9000), sub: '₹500/day fixed', icon: 'payments', color: 'blue' },
          { label: 'Today', value: 'Present', sub: 'marked by admin · 09:12', icon: 'task_alt', color: 'amber' },
          { label: 'Next payout', value: 'Aug 1', sub: 'monthly settlement', icon: 'calendar_month', color: 'violet' },
        ]));
      }

      // charts row
      const canReports = ['super_admin', 'admin', 'accountant'].includes(role);
      if (canReports) {
        container.insertAdjacentHTML('beforeend', secHead('monitoring', 'Analytics', 'Sales, revenue & costs'));
        container.insertAdjacentHTML('beforeend', `<div class="grid grid-2 mb-16">
          ${chartCard('Sales · last 30 days', 'bar_chart', 'ch-sales')}
          ${chartCard('Revenue vs Expenses', 'pie_chart', 'ch-rev')}
        </div>`);
        const [st, pl] = await Promise.all([API.get('/api/reports/sales-trends'), API.get('/api/finance/pl')]);
        const s30 = st.data.slice(-30);
        chartInto(container, '#ch-sales', box => Charts.bar(box, s30.map(d => ({ label: d.date, value: d.value })), { labels: true }));
        const last = pl.data[pl.data.length - 1] || { revenue: 0, expenses: 0 };
        chartInto(container, '#ch-rev', box => Charts.doughnut(box, [
          { label: 'Revenue', value: last.revenue }, { label: 'Expenses', value: last.expenses },
        ], { center: money(last.revenue - last.expenses, 0), centerLabel: 'NET' }));
      }

      // AI card for everyone
      container.insertAdjacentHTML('beforeend', secHead('auto_awesome', 'AI Business Assistant', 'Ask anything about your business'));
      container.insertAdjacentHTML('beforeend', aiCard());
      bindAi(container);
      if (canReports) {
        container.insertAdjacentHTML('beforeend', secHead('inventory_2', 'Operations', 'Stock levels & workshop pipeline'));
        container.insertAdjacentHTML('beforeend', `<div class="grid grid-2 mt-8">
          ${chartCard('Low stock materials', 'inventory', 'ch-low')}
          ${chartCard('Work pipeline', 'construction', 'ch-work')}
        </div>`);
        const [mats, works] = await Promise.all([API.get('/api/inventory/materials'), API.get('/api/work/orders')]);
        const low = mats.data.filter(m => m.stock < m.min_stock);
        chartInto(container, '#ch-low', box => Charts.bar(box, (low.length ? low : mats.data.slice(0, 6)).map(m => ({ label: m.name, value: m.stock, color: m.stock < m.min_stock ? '#EF4444' : '#2563EB' })), { labels: true }));
        const counts = { todo: 0, in_progress: 0, under_review: 0, done: 0 };
        works.data.forEach(w => { counts[w.status] = (counts[w.status] || 0) + 1; });
        chartInto(container, '#ch-work', box => Charts.doughnut(box, [
          { label: 'Todo', value: counts.todo }, { label: 'In progress', value: counts.in_progress },
          { label: 'Under review', value: counts.under_review }, { label: 'Done', value: counts.done },
        ], { center: works.data.length, centerLabel: 'ORDERS' }));
      }

      const bind = (sel, fn) => { const el = container.querySelector(sel); if (el) el.onclick = fn; };
      bind('[data-go-ai]', () => window.VinosheelApp.go('/ai'));
      bind('[data-new-any]', () => window.VinosheelApp.openPalette());
    });
  };

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning ☀️' : h < 17 ? 'Good afternoon 🌤️' : 'Good evening 🌙';
  }
  function roleTitle(r) {
    return { super_admin: 'Executive Command Centre', admin: 'Business Operations Dashboard', accountant: 'Accounts & Billing Overview', contractor: 'Contractor Workshop Board', painter: 'Painting & Finishing Board', monthly: 'My Workspace', daily: 'Daily Wager Workspace' }[r] || 'Dashboard';
  }

  // dashboard grid helper for other views

  function chartInto(container, sel, draw) {
    const box = container.querySelector(sel);
    if (!box) return; // view was replaced while loading
    draw(box);
  }

  window.Dash = { kpiGrid, chartCard, bindAi, aiCard };
})();

</script>
<script>
/* Vinosheel ERP — People: employee management, approvals, attendance, payroll. */
(function () {
  const { $, esc, money, num, pill, roleChip, toast, confirmDlg } = window.UI;

  window.Views = window.Views || {};

  // ------------------------------------------------------------------ users
  window.Views.users = function (container) {
    container.innerHTML = UI.skeleton(6);
    API.get('/api/users').then(({ data: users }) => {
      container.innerHTML = `
      <div class="page-head">
        <div><h1>Employees</h1><p>Manage ${users.length} team members — add, suspend, reassign roles & reset passwords. Only Admin / Super Admin can create accounts.</p></div>
        <div class="spacer"></div>
        <button class="btn btn-primary" data-add><span class="icon material-symbols-outlined">person_add</span> Add employee</button>
      </div>
      <div class="toolbar">
        <div class="search-box"><span class="icon material-symbols-outlined">search</span><input class="input" placeholder="Search name, email, role…" data-q /></div>
        <select class="select" data-role><option value="">All roles</option>
          <option>admin</option><option>accountant</option><option>contractor</option><option>painter</option><option>monthly</option><option>daily</option></select>
      </div>
      <div class="card tbl-wrap"><table class="tbl">
        <thead><tr><th>Employee</th><th>Role</th><th>Designation</th><th>Contact</th><th>Compensation</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
        <tbody data-rows></tbody>
      </table></div>`;
      const tbody = container.querySelector('[data-rows]');
      const render = () => {
        const q = (container.querySelector('[data-q]').value || '').toLowerCase();
        const rf = container.querySelector('[data-role]').value;
        const rows = users.filter(u =>
          (!rf || u.role === rf) &&
          (!q || (u.name + u.email + u.designation).toLowerCase().includes(q)));
        tbody.innerHTML = rows.map(u => `
          <tr>
            <td><div class="row"><span class="avatar ${UI.avatarColor(u.name)}">${UI.initials(u.name)}</span>
              <div><b>${esc(u.name)}</b><div class="muted small">${esc(u.email)}</div></div></div></td>
            <td>${roleChip(u.role)}</td>
            <td>${esc(u.designation || '—')}<div class="muted small">${esc(u.department || '')}</div></td>
            <td class="muted">${esc(u.phone || '—')}</td>
            <td class="mono">${u.role === 'daily' ? money(u.daily_rate) + '/day' : u.role === 'monthly' ? money(u.monthly_salary) + '/mo' : '—'}</td>
            <td>${pill(u.status)}</td>
            <td class="text-right">
              <button class="btn btn-ghost btn-sm" data-actions="${u.id}"><span class="icon material-symbols-outlined" style="font-size:18px">more_horiz</span></button>
            </td>
          </tr>`).join('') || `<tr><td colspan="7">${UI.emptyState('group_off', 'No matches', 'Adjust your search or filters')}</td></tr>`;
        tbody.querySelectorAll('[data-actions]').forEach(b => b.onclick = e => {
          e.stopPropagation();
          const u = users.find(x => x.id == b.dataset.actions);
          const m = UI.menu(b, [
            { id: 'edit', label: 'Edit details', icon: 'edit' },
            { id: 'role', label: 'Assign role', icon: 'manage_accounts' },
            { id: 'pw', label: 'Reset password', icon: 'key' },
            { id: u.status === 'active' ? 'sus' : 'act', label: u.status === 'active' ? 'Suspend account' : 'Reactivate', icon: 'block', danger: u.status === 'active' },
          ]);
          m.onAction(async act => {
            if (act === 'edit') editUser(u, users);
            if (act === 'role') {
              const roles = ['admin', 'accountant', 'contractor', 'painter', 'monthly', 'daily'];
              UI.modal({
                title: 'Assign role — ' + u.name, icon: 'manage_accounts',
                body: `<p class="muted mb-8">Role determines the dashboard, sidebar and permissions.</p>
                  <select class="select" style="width:100%" data-newrole>${roles.map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select>`,
                foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="rl-ok">Save role</button>`,
              });
              $('#rl-ok').onclick = async () => {
                try {
                  await API.patch('/api/users/' + u.id + '/role', { role: document.querySelector('[data-newrole]').value });
                  toast('ok', 'Role updated'); window.VinosheelApp.go('/users');
                } catch (err) { toast('err', 'Failed', err.message); }
              };
            }
            if (act === 'pw') {
              UI.modal({
                title: 'Reset password — ' + u.name, icon: 'key',
                body: `<div class="field"><label>New temporary password</label><input class="input" type="password" data-newpw placeholder="Min 8 characters" /></div>`,
                foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="pw-ok">Reset</button>`,
              });
              $('#pw-ok').onclick = async () => {
                const pw = document.querySelector('[data-newpw]').value;
                if (pw.length < 8) return toast('err', 'Too short', 'Min 8 characters');
                await API.post('/api/users/' + u.id + '/reset-password', { new_password: pw });
                toast('ok', 'Password reset', 'The employee will be asked to change it on next sign-in');
              };
            }
            if (act === 'sus' || act === 'act') {
              confirmDlg({ title: (act === 'sus' ? 'Suspend' : 'Reactivate') + ' ' + u.name + '?', msg: 'Suspended users are signed out immediately and cannot log in.', danger: act === 'sus', okText: act === 'sus' ? 'Suspend' : 'Reactivate', onOk: async () => {
                await API.post('/api/users/' + u.id + '/suspend', { suspend: act === 'sus' });
                toast('ok', u.name + (act === 'sus' ? ' suspended' : ' reactivated'));
                window.VinosheelApp.go('/users');
              } });
            }
          });
        });
      };
      render();
      container.querySelector('[data-q]').oninput = render;
      container.querySelector('[data-role]').onchange = render;
      container.querySelector('[data-add]').onclick = () => window.VinosheelApp.go('/register');
    });
  };

  function editUser(u, users) {
    UI.modal({
      title: 'Edit — ' + u.name, icon: 'edit', wide: true,
      body: `<div class="form-grid">
        <div class="field"><label>Full name</label><input class="input" data-f name value="${esc(u.name)}" /></div>
        <div class="field"><label>Phone</label><input class="input" data-f phone value="${esc(u.phone || '')}" /></div>
        <div class="field"><label>Designation</label><input class="input" data-f designation value="${esc(u.designation || '')}" /></div>
        <div class="field"><label>Department</label><input class="input" data-f department value="${esc(u.department || '')}" /></div>
        <div class="field"><label>Monthly salary (₹)</label><input class="input" type="number" data-f monthly_salary value="${u.monthly_salary || 0}" /></div>
        <div class="field"><label>Daily rate (₹)</label><input class="input" type="number" data-f daily_rate value="${u.daily_rate || 0}" /></div>
      </div>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ed-ok">Save changes</button>`,
    });
    $('#ed-ok').onclick = async () => {
      const body = {};
      document.querySelectorAll('[data-f]').forEach(i => { body[i.dataset.f] = i.value; });
      await API.patch('/api/users/' + u.id, body);
      toast('ok', 'Employee updated');
      window.VinosheelApp.go('/users');
    };
  }

  // ------------------------------------------------------------- approvals
  window.Views.approvals = function (container) {
    container.innerHTML = UI.skeleton(4);
    API.get('/api/approvals/pending').then(({ data }) => {
      container.innerHTML = `
      <div class="page-head"><div><h1>Approval queue</h1><p>New inventory categories, products & raw materials need Admin review before going live.</p></div>
        <div class="spacer"></div><span class="pill amber">${data.length} pending</span></div>
      ${data.length ? `<div class="grid grid-2">${data.map(a => `
        <div class="card">
          <div class="card-head"><span class="icon material-symbols-outlined">fact_check</span><h3>${esc(a.name)}</h3>
            <span class="pill ${a.kind === 'category' ? 'blue' : a.kind === 'item' ? 'violet' : 'green'}">${esc(a.kind)}</span></div>
          <div class="card-pad">
            <p class="muted small">Requested ${UI.ago(a.created_at)} by user #${a.requested_by || '—'}</p>
            ${a.meta && (a.meta.description || a.meta.category || a.meta.unit) ? `<p class="small mt-8">${esc(a.meta.description || '')} ${esc(a.meta.category || '')} ${esc(a.meta.unit || '')}</p>` : ''}
            <div class="row mt-16">
              <button class="btn btn-green btn-sm" data-ap="${a.kind}:${a.id}"><span class="icon material-symbols-outlined">check</span> Approve</button>
              <button class="btn btn-ghost btn-sm" data-rj="${a.kind}:${a.id}"><span class="icon material-symbols-outlined">close</span> Reject</button>
            </div>
          </div>
        </div>`).join('')}</div>` : `<div class="card">${UI.emptyState('verified', 'Queue is clear', 'Nothing waiting for review — great work')}</div>`}`;
      container.querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
        const [kind, id] = b.dataset.ap.split(':');
        await API.post(`/api/approvals/${kind}/${id}/approve`, { note: 'Approved' });
        toast('ok', 'Approved', 'Changes are now live');
        window.VinosheelApp.go('/approvals');
      });
      container.querySelectorAll('[data-rj]').forEach(b => b.onclick = async () => {
        const [kind, id] = b.dataset.rj.split(':');
        UI.modal({ title: 'Reject with note', icon: 'rate_review',
          body: '<textarea class="input" data-note rows="3" placeholder="What changes are required?"></textarea>',
          foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" id="rj-ok">Reject & notify</button>` });
        $('#rj-ok').onclick = async () => {
          await API.post(`/api/approvals/${kind}/${id}/reject`, { note: document.querySelector('[data-note]').value || 'Changes required' });
          toast('ok', 'Rejected', 'Requester has been notified');
          window.VinosheelApp.go('/approvals');
        };
      });
    });
  };

  // ------------------------------------------------------------ attendance
  window.Views.attendance = function (container) {
    const me = API.session().user;
    const isAdmin = ['admin', 'super_admin'].includes(me.role);
    container.innerHTML = UI.skeleton(4);
    const jobs = [API.get('/api/attendance/trends')];
    if (isAdmin) jobs.push(API.get('/api/users').catch(() => ({ data: [] })));
    Promise.all(jobs).then(([tr, us]) => {
      us = us || { data: [] };
      container.innerHTML = `
      <div class="page-head"><div><h1>Attendance</h1><p>${isAdmin ? 'Admin override — only Admins can edit attendance.' : 'Your attendance — editable only by Admin.'}</p></div></div>
      <div class="grid grid-2">
        <div class="card"><div class="card-head"><span class="icon material-symbols-outlined">calendar_month</span><h3>Last 30 days</h3></div>
          <div class="card-pad chart-box" id="att-heat"></div></div>
        <div class="card"><div class="card-head"><span class="icon material-symbols-outlined">event_available</span><h3>${isAdmin ? 'Mark / override' : 'My status'}</h3></div>
          <div class="card-pad">
            ${isAdmin ? `
            <div class="form-grid">
              <div class="field"><label>Employee</label><select class="select" style="width:100%" data-u>${us.data.filter(u => ['monthly', 'daily', 'contractor', 'painter'].includes(u.role)).map(u => `<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select></div>
              <div class="field"><label>Date</label><input class="input" type="date" data-d value="${new Date().toISOString().slice(0, 10)}" /></div>
              <div class="field"><label>Status</label><select class="select" style="width:100%" data-s><option>present</option><option>absent</option><option>half_day</option><option>leave</option></select></div>
              <div class="field"><label>Check-in / out</label><div class="row"><input class="input" data-ci value="09:15" /><input class="input" data-co value="18:05" /></div></div>
            </div>
            <button class="btn btn-primary mt-8" data-ovr><span class="icon material-symbols-outlined">edit_calendar</span> Override attendance</button>
            <p class="muted small mt-8">GPS & Face-recognition check-in are placeholders — tap below to simulate.</p>
            <div class="row mt-8">
              <button class="btn btn-ghost btn-sm" data-gps><span class="icon material-symbols-outlined">location_on</span> GPS check-in</button>
              <button class="btn btn-ghost btn-sm" data-face><span class="icon material-symbols-outlined">face</span> Face check-in</button>
            </div>` : `
            <div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line-2)">
              <div><b>Today</b><div class="muted small">${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
              <span class="pill green">Present · 09:12</span>
            </div>
            <div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line-2)"><div><b>This month</b></div><b class="mono">22 / 26 days</b></div>
            <div class="row between" style="padding:12px 0"><div><b>Half days</b></div><span class="mono">1</span></div>`}
          </div></div>
      </div>`;
      // heatmap
      const cells = tr.data.slice(-30);
      const map = {};
      cells.forEach(c => { map[c.date] = (map[c.date] || 0) + c.n; });
      const days = [];
      const d = new Date(Date.now() - 29 * 864e5);
      for (let i = 0; i < 30; i++) {
        const key = d.toISOString().slice(0, 10);
        days.push({ label: key, value: map[key] || 0, date: key });
        d.setDate(d.getDate() + 1);
      }
      Charts.heatmap(container.querySelector('#att-heat'), days);
      if (isAdmin) {
        container.querySelector('[data-ovr]').onclick = async () => {
          await API.post('/api/attendance/override', {
            user_id: +container.querySelector('[data-u]').value, date: container.querySelector('[data-d]').value,
            status: container.querySelector('[data-s]').value, check_in: container.querySelector('[data-ci]').value,
            check_out: container.querySelector('[data-co]').value,
          });
          toast('ok', 'Attendance marked', 'Employee notified');
        };
        container.querySelector('[data-gps]').onclick = () => { UI.modal({ title: 'GPS check-in', icon: 'location_on', body: '<div class="card card-pad chart-box" id="gps-map"></div><p class="muted small mt-8">Simulated GPS — Workshop, Saharanpur Road (28.6°N, 77.7°E)</p>', foot: '<button class="btn btn-primary" data-close>Done</button>' }); UI.toast('ok', 'GPS verified', 'Location captured · 28.6042°N, 77.7272°E'); };
        container.querySelector('[data-face]').onclick = () => { UI.modal({ title: 'Face recognition', icon: 'face', body: '<div class="card card-pad" style="text-align:center;padding:30px"><span class="icon material-symbols-outlined" style="font-size:64px;color:var(--brand-2)">face_6</span><p class="muted mt-8">Simulated camera feed — production uses on-device face matching</p></div>', foot: '<button class="btn btn-primary" data-close>Verified ✓</button>' }); UI.toast('ok', 'Face matched', 'Identity confirmed'); };
      }
    });
  };

  // ---------------------------------------------------------------- payroll
  window.Views.payroll = function (container) {
    const me = API.session().user;
    container.innerHTML = UI.skeleton(5);
    Promise.all([API.get('/api/payroll/payslips'), API.get('/api/users').catch(() => ({ data: [] }))]).then(([ps, us]) => {
      const isAdmin = ['admin', 'super_admin'].includes(me.role);
      container.innerHTML = `
      <div class="page-head"><div><h1>Payroll</h1><p>${isAdmin ? 'Generate payslips, add bonus/penalty/overtime with remarks.' : 'Your salary, bonuses, deductions & payslips.'}</p></div>
        <div class="spacer"></div>
        ${isAdmin ? `<button class="btn btn-primary" data-gen><span class="icon material-symbols-outlined">payments</span> Generate month's payroll</button>` : ''}</div>
      <div class="grid grid-2">
        <div class="card"><div class="card-head"><span class="icon material-symbols-outlined">receipt_long</span><h3>Payslips</h3></div>
          <div class="card-pad">${ps.data.length ? ps.data.map(p => `
            <div class="row between" style="padding:11px 0;border-bottom:1px solid var(--line-2)">
              <div><b>${esc(p.period)}</b><div class="muted small">${esc(p.user_name || '')} · ${pill(p.status)}</div></div>
              <div class="text-right"><b class="mono">${money(p.net)}</b><div class="muted small">gross ${money(p.basic + p.bonus)}</div></div>
            </div>`).join('') : UI.emptyState('receipt_long', 'No payslips yet', 'Run payroll to generate')}</div></div>
        ${isAdmin ? `
        <div class="card"><div class="card-head"><span class="icon material-symbols-outlined">tune</span><h3>Adjustment (bonus / penalty / overtime)</h3></div>
          <div class="card-pad">
            <div class="form-grid">
              <div class="field"><label>Employee</label><select class="select" style="width:100%" data-u>${us.data.filter(u => u.role === 'monthly').map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
              <div class="field"><label>Kind</label><select class="select" style="width:100%" data-k><option>bonus</option><option>penalty</option><option>overtime</option><option>deduction</option></select></div>
              <div class="field"><label>Amount (₹)</label><input class="input" type="number" data-a value="1000" /></div>
              <div class="field"><label>Period</label><input class="input" data-p value="${new Date().toISOString().slice(0, 7)}" /></div>
            </div>
            <div class="field"><label>Remark (required for audit)</label><input class="input" data-r placeholder="e.g. Diwali bonus, late login penalty…" /></div>
            <button class="btn btn-primary" data-adj><span class="icon material-symbols-outlined">add_card</span> Apply adjustment</button>
          </div></div>` : `
        <div class="card"><div class="card-head"><span class="icon material-symbols-outlined">account_balance</span><h3>Compensation summary</h3></div>
          <div class="card-pad">
            <div class="row between" style="padding:9px 0"><span class="muted">Basic salary</span><b class="mono">${money(me.monthly_salary || 0)}</b></div>
            <div class="row between" style="padding:9px 0"><span class="muted">Bonus (avg)</span><b class="mono up">+${money(2000)}</b></div>
            <div class="row between" style="padding:9px 0"><span class="muted">Deductions (PF ~12%)</span><b class="mono down">−${money((me.monthly_salary || 0) * 0.12)}</b></div>
            <div class="row between" style="padding:12px 0 0;border-top:1px solid var(--line)"><b>Net monthly</b><b class="mono" style="font-size:17px">${money((me.monthly_salary || 0) * 0.88 + 2000)}</b></div>
          </div></div>`}
      </div>`;
      if (isAdmin) {
        container.querySelector('[data-gen]').onclick = async () => {
          const { data } = await API.post('/api/payroll/generate', { period: new Date().toISOString().slice(0, 7) });
          toast('ok', 'Payroll generated', `${data.generated} payslips created & employees notified`);
          window.VinosheelApp.go('/payroll');
        };
        container.querySelector('[data-adj]').onclick = async () => {
          const remark = container.querySelector('[data-r]').value;
          if (!remark) return toast('err', 'Remark required', 'Audit trail needs a reason');
          await API.post('/api/payroll/adjustments', {
            user_id: +container.querySelector('[data-u]').value, kind: container.querySelector('[data-k]').value,
            amount: +container.querySelector('[data-a]').value, period: container.querySelector('[data-p]').value, remark,
          });
          toast('ok', 'Adjustment applied', 'Employee notified');
        };
      }
    });
  };

  window.Views.payments = function (container) {
    container.innerHTML = UI.skeleton(5);
    API.get('/api/payments').then(({ data }) => {
      const isAdmin = ['admin', 'super_admin'].includes(API.session().user.role);
      container.innerHTML = `
      <div class="page-head"><div><h1>Payments</h1><p>Auto-generated from completed work at predefined rates (Bed ₹5,000 · Chair ₹1,200 · Door ₹900 …).</p></div></div>
      <div class="card tbl-wrap"><table class="tbl">
        <thead><tr><th>Worker</th><th>Work</th><th>Qty</th><th>Rate</th><th>Amount</th><th>Status</th><th class="text-right">Action</th></tr></thead>
        <tbody>${data.map(p => `<tr>
          <td><b>${esc(p.user_name || '')}</b><div class="muted small">${esc(p.role)}</div></td>
          <td>${esc(p.work_type)}</td><td class="num">${num(p.qty)}</td><td class="num">${money(p.rate)}</td>
          <td class="num strong">${money(p.amount)}</td><td>${pill(p.status)}</td>
          <td class="text-right">${isAdmin && p.status === 'pending' ? `<button class="btn btn-green btn-sm" data-ap="${p.id}">Approve</button>` : ''}</td>
        </tr>`).join('') || `<tr><td colspan="7">${UI.emptyState('payments', 'No payments yet', 'Completed work creates payments automatically')}</td></tr>`}</tbody>
      </table></div>`;
      container.querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
        await API.post('/api/payments/' + b.dataset.ap + '/approve', { status: 'approved' });
        toast('ok', 'Payment approved', 'Worker notified');
        window.VinosheelApp.go('/payments');
      });
    });
  };
})();

</script>
<script>
/* Vinosheel ERP — Inventory: unlimited nested categories, items with stock,
   barcode/QR, photo catalogue, duplicate detection, approval flow. */
(function () {
  const { $, esc, money, num, pill, toast, confirmDlg } = window.UI;
  window.Views = window.Views || {};

  function treeHTML(nodes, depth = 0, openAll = true) {
    return nodes.map(n => `
      <div class="tree-node" style="${depth === 0 ? 'margin-left:0;border-left:none;padding-left:0' : ''}">
        <div class="tree-item">
          <span class="chev material-symbols-outlined ${n.children && n.children.length ? 'open' : 'hidden'}">chevron_right</span>
          <span class="f-icon"><span class="icon material-symbols-outlined">${esc(n.icon || 'category')}</span></span>
          <b>${esc(n.name)}</b>
          <span class="muted small">${n.children ? n.children.length + ' sub' : ''}</span>
          <span class="grow"></span>
          <button class="btn btn-ghost btn-sm" data-addcat="${n.id}">+ Sub</button>
        </div>
        ${n.children && n.children.length ? treeHTML(n.children, depth + 1) : ''}
      </div>`).join('');
  }

  window.Views.inventory = function (container) {
    const me = API.session().user;
    const canWrite = ['admin', 'super_admin', 'accountant'].includes(me.role);
    container.innerHTML = UI.skeleton(5);
    Promise.all([API.get('/api/inventory/tree'), API.get('/api/inventory/items'), API.get('/api/inventory/low-stock')]).then(([tree, items, low]) => {
      container.innerHTML = `
      <div class="page-head"><div><h1>Inventory</h1><p>Unlimited nested hierarchy — Wood → Sheesham → Khapti → Grade A → Size → Thickness. New categories & products need Admin approval.</p></div>
        <div class="spacer"></div>
        ${canWrite ? `<button class="btn btn-primary" data-newitem><span class="icon material-symbols-outlined">add_box</span> New product</button>
          <button class="btn btn-ghost" data-newcat><span class="icon material-symbols-outlined">create_new_folder</span> New category</button>` : ''}
      </div>
      <div class="toolbar">
        <div class="search-box"><span class="icon material-symbols-outlined">search</span><input class="input" placeholder="Search products, SKU, supplier…" data-q /></div>
        <select class="select" data-wh><option value="">All warehouses</option><option>Main Warehouse</option><option>Workshop</option><option>Showroom</option><option>Sawmill</option></select>
        <span class="pill ${low.data.length ? 'red' : 'green'}">${low.data.length ? low.data.length + ' low stock' : 'Stock healthy'}</span>
      </div>
      <div class="grid grid-2">
        <div class="card">
          <div class="card-head"><span class="icon material-symbols-outlined">account_tree</span><h3>Category tree</h3>
            <div class="spacer"></div><span class="pill blue">unlimited depth</span></div>
          <div class="card-pad">${treeHTML(tree.data)}</div>
        </div>
        <div class="card">
          <div class="card-head"><span class="icon material-symbols-outlined">inventory_2</span><h3>Products & stock</h3><span class="spacer"></span><span class="pill gray">${items.data.length} items</span></div>
          <div class="card-pad" style="max-height:520px;overflow:auto" data-items></div>
        </div>
      </div>`;

      const itemsBox = container.querySelector('[data-items]');
      const renderItems = () => {
        const q = (container.querySelector('[data-q]').value || '').toLowerCase();
        const wh = container.querySelector('[data-wh]').value;
        const rows = items.data.filter(i =>
          (!wh || i.warehouse === wh) &&
          (!q || (i.name + i.sku + (i.supplier || '')).toLowerCase().includes(q)));
        itemsBox.innerHTML = rows.map(i => `
          <div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line-2)" data-item="${i.id}">
            <div class="row">
              <div class="k-icon blue" style="width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(37,99,235,.1);color:var(--brand-2)">
                <span class="icon material-symbols-outlined">${i.damaged ? 'report' : 'chair'}</span></div>
              <div><b>${esc(i.name)}</b>
                <div class="muted small">${esc(i.sku)} · ${esc(i.warehouse)} · ${esc(i.location || '')}${i.damaged ? ' · <span style="color:var(--red)">DAMAGED</span>' : ''}</div></div>
            </div>
            <div class="text-right">
              <div class="mono"><b>${num(i.current_stock)}</b> <span class="muted small">/ min ${num(i.min_stock)}</span></div>
              <div class="progress mt-8" style="width:110px"><i style="width:${Math.min(100, i.max_stock ? i.current_stock / i.max_stock * 100 : 100)}%"></i></div>
            </div>
          </div>`).join('') || UI.emptyState('search_off', 'No products', 'Try a different search');
        itemsBox.querySelectorAll('[data-item]').forEach(el => el.onclick = () => openItem(items.data.find(i => i.id == el.dataset.item)));
      };
      renderItems();
      container.querySelector('[data-q]').oninput = renderItems;
      container.querySelector('[data-wh]').onchange = renderItems;

      container.querySelectorAll('[data-addcat]').forEach(b => b.onclick = () => openCategory(b.dataset.addcat));
      container.querySelector('[data-newcat]').onclick = () => openCategory(null);
      container.querySelector('[data-newitem]').onclick = () => openItem(null, tree.data);
    });
  };

  function openCategory(parentId) {
    UI.modal({
      title: parentId ? 'Add sub-category' : 'New inventory category', icon: 'create_new_folder',
      body: `<div class="field"><label>Name</label><input class="input" data-name placeholder="e.g. Grade A" /></div>
             <div class="field"><label>Description</label><input class="input" data-desc placeholder="Optional" /></div>
             <p class="muted small">${parentId ? 'Nested inside an existing category.' : 'New categories require Admin approval before going live.'}</p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="cat-ok">Create</button>`,
    });
    $('#cat-ok').onclick = async () => {
      const name = document.querySelector('[data-name]').value.trim();
      if (!name) return toast('err', 'Name required');
      const { data } = await API.post('/api/inventory/categories', { name, description: document.querySelector('[data-desc]').value, parent_id: parentId });
      if (data.status === 'pending') toast('info', 'Sent for approval', 'Admin has been notified');
      else toast('ok', 'Category created');
      window.VinosheelApp.go('/inventory');
    };
  }

  function openItem(item, tree) {
    const isNew = !item;
    UI.modal({
      title: isNew ? 'New product' : 'Product — ' + item.name, icon: 'inventory_2', wide: true,
      body: `
      <div class="form-grid">
        <div class="field full"><label>Name</label><input class="input" data-f name value="${isNew ? '' : esc(item.name)}" data-detect /></div>
        <div class="field"><label>SKU</label><input class="input" data-f sku value="${isNew ? '' : esc(item.sku)}" /></div>
        <div class="field"><label>Category (tree)</label>
          <select class="select" style="width:100%" data-cat>${(function flat(ns, d = 0, out = []) { ns.forEach(n => { out.push(`<option value="${n.id}">${'·'.repeat(d)} ${esc(n.name)}</option>`); flat(n.children, d + 1, out); }); return out; })(tree || []).join('')}</select></div>
        <div class="field"><label>Supplier</label><input class="input" data-f supplier value="${isNew ? '' : esc(item.supplier || '')}" /></div>
        <div class="field"><label>GST rate (%)</label><input class="input" type="number" data-f gst_rate value="${isNew ? 18 : item.gst_rate}" /></div>
        <div class="field"><label>Purchase price (₹)</label><input class="input" type="number" data-f purchase_price value="${isNew ? '' : item.purchase_price}" /></div>
        <div class="field"><label>Selling price (₹, optional)</label><input class="input" type="number" data-f selling_price value="${isNew ? '' : item.selling_price || ''}" />
          <p class="muted small">Final price is set only during billing — hidden from customers.</p></div>
        <div class="field"><label>Current stock</label><input class="input" type="number" data-f current_stock value="${isNew ? 0 : item.current_stock}" /></div>
        <div class="field"><label>Min / Max stock</label><div class="row"><input class="input" type="number" data-f min_stock value="${isNew ? 0 : item.min_stock}" /><input class="input" type="number" data-f max_stock value="${isNew ? 0 : item.max_stock}" /></div></div>
        <div class="field"><label>Warehouse</label><select class="select" style="width:100%" data-f warehouse>
          ${['Main Warehouse', 'Workshop', 'Showroom', 'Sawmill'].map(w => `<option ${!isNew && item.warehouse === w ? 'selected' : ''}>${w}</option>`).join('')}</select></div>
        <div class="field"><label>Location</label><input class="input" data-f location value="${isNew ? '' : esc(item.location || '')}" /></div>
        <div class="field"><label>Batch no.</label><input class="input" data-f batch_no value="${isNew ? '' : esc(item.batch_no || '')}" /></div>
        <div class="field"><label>Lot no.</label><input class="input" data-f lot_no value="${isNew ? '' : esc(item.lot_no || '')}" /></div>
        <div class="field full"><label>Description</label><textarea class="input" data-f description rows="2">${isNew ? '' : esc(item.description || '')}</textarea></div>
        ${!isNew ? `<div class="field full"><label>Barcode</label><div class="row"><input class="input mono" value="${esc(item.barcode || '')}" readonly /><input class="input mono" value="${esc(item.qr_code || '')}" readonly /></div></div>` : ''}
      </div>
      ${isNew ? '<p class="muted small mt-8">As an accountant, new products go to Admin for approval.</p>' : ''}`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
        ${!isNew && item.damaged ? '' : ''}
        <button class="btn btn-primary" id="it-ok">${isNew ? 'Create product' : 'Save changes'}</button>`,
    });
    // duplicate detection
    const nameInp = document.querySelector('[data-f][data-detect]');
    nameInp.addEventListener('blur', async () => {
      if (!nameInp.value.trim()) return;
      try {
        const { data } = await API.get('/api/inventory/duplicate-check?name=' + encodeURIComponent(nameInp.value.trim()));
        if (data.duplicate) toast('info', 'Possible duplicate', 'Similar product: ' + (data.existing && data.existing.name));
      } catch (e) { /* ignore */ }
    });
    $('#it-ok').onclick = async () => {
      const body = {};
      document.querySelectorAll('[data-f]').forEach(i => { body[i.dataset.f] = i.type === 'number' ? +i.value || 0 : i.value; });
      body.category_id = +(document.querySelector('[data-cat]') ? document.querySelector('[data-cat]').value : item && item.category_id);
      try {
        if (isNew) {
          const { data } = await API.post('/api/inventory/items', body);
          toast(data.status === 'pending' ? 'info' : 'ok', data.status === 'pending' ? 'Sent for approval' : 'Product created', data.status === 'pending' ? 'Admin notified' : '');
        } else {
          await API.patch('/api/inventory/items/' + item.id, body);
          toast('ok', 'Product updated');
        }
        window.VinosheelApp.go('/inventory');
      } catch (e) { toast('err', 'Failed', e.message); }
    };
  }

  // stock management subview (admin/accountant)
  window.Views.stock = function (container) {
    container.innerHTML = UI.skeleton(5);
    API.get('/api/inventory/items').then(({ data }) => {
      container.innerHTML = `

})();

<script>
/* Vinosheel ERP — Work: orders, deadlines, priorities, submissions with
   auto-payment, contractor/painter views, comments. */
(function () {
  const { $, esc, money, num, pill, toast, confirmDlg } = window.UI;
  window.Views = window.Views || {};

  window.Views.work = function (container) {
    const me = API.session().user;
    const isWorker = me.role === 'contractor' || me.role === 'painter';
    const isAdmin = ['admin', 'super_admin'].includes(me.role);
    container.innerHTML = UI.skeleton(5);
    Promise.all([API.get('/api/work/orders'), API.get('/api/work-types'), API.get('/api/users').catch(() => ({ data: [] }))]).then(([wo, wts, us]) => {
      const workers = us.data.filter(u => u.role === 'contractor' || u.role === 'painter');
      const canSubmit = isWorker;
      container.innerHTML = `
      <div class="page-head"><div><h1>${isWorker ? 'My work' : 'Work orders'}</h1>
        <p>${isWorker ? 'Assigned tasks, deadlines & auto-payments by completed work.' : 'Assign work, track progress, review submissions & release payments.'}</p></div>
        <div class="spacer"></div>
        ${isAdmin ? `<button class="btn btn-primary" data-new><span class="icon material-symbols-outlined">add_task</span> New work order</button>` : ''}
      </div>
      <div class="toolbar">
        <div class="search-box"><span class="icon material-symbols-outlined">search</span><input class="input" placeholder="Search orders…" data-q /></div>
        <select class="select" data-s><option value="">All statuses</option><option>todo</option><option>in_progress</option><option>under_review</option><option>done</option><option>cancelled</option></select>
        <select class="select" data-p><option value="">All priorities</option><option>low</option><option>medium</option><option>high</option><option>urgent</option></select>
      </div>
      <div class="grid grid-2" data-orders></div>`;

      const render = () => {
        const q = (container.querySelector('[data-q]').value || '').toLowerCase();
        const st = container.querySelector('[data-s]').value;
        const pr = container.querySelector('[data-p]').value;
        const rows = wo.data.filter(o =>
          (!st || o.status === st) && (!pr || o.priority === pr) &&
          (!q || (o.title + (o.work_type || '')).toLowerCase().includes(q)));
        const box = container.querySelector('[data-orders]');
        box.innerHTML = rows.map(o => {
          const worker = workers.find(w => w.id === o.assigned_to);
          const late = o.deadline && o.status !== 'done' && o.deadline < new Date().toISOString().slice(0, 10);
          return `
          <div class="card hover card-pad">
            <div class="row between">
              <span class="pill ${o.priority === 'urgent' ? 'red' : o.priority === 'high' ? 'amber' : o.priority === 'medium' ? 'blue' : 'gray'}">${esc(o.priority)}</span>
              ${pill(o.status)}
              ${late ? '<span class="pill red">overdue</span>' : ''}
            </div>
            <h3 class="mt-8" style="font-size:15.5px">${esc(o.title)}</h3>
            <p class="muted small mt-8">${num(o.qty)} × ${esc(o.work_type)} @ ${money(o.rate)} · est. ${money(o.est_cost)}</p>
            <div class="row between mt-16">
              <div class="row">
                ${worker ? `<span class="avatar ${UI.avatarColor(worker.name)}" style="width:28px;height:28px;font-size:11px">${UI.initials(worker.name)}</span><span class="small">${esc(worker.name)}</span>` : '<span class="muted small">unassigned</span>'}
              </div>
              <span class="small muted">due ${esc(o.deadline || '—')}</span>
            </div>
            <div class="row mt-16">
              <div class="progress grow"><i style="width:${o.progress}%"></i></div>
              <b class="small">${o.progress}%</b>
            </div>
            <div class="row mt-16">
              <button class="btn btn-ghost btn-sm" data-open="${o.id}">Open</button>
              ${canSubmit && o.status !== 'done' && o.status !== 'cancelled' && o.assigned_to === me.id ? `<button class="btn btn-green btn-sm" data-sub="${o.id}"><span class="icon material-symbols-outlined">task_alt</span> Submit completed</button>` : ''}
              ${isAdmin && o.status !== 'done' ? `<button class="btn btn-ghost btn-sm" data-status="${o.id}">Update</button>` : ''}
            </div>
          </div>`;
        }).join('') || `<div class="card">${UI.emptyState('assignment', 'No orders', 'Create a work order or adjust filters')}</div>`;
        box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDetail(wo.data.find(x => x.id == b.dataset.open), workers));
        box.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => submitForm(wo.data.find(x => x.id == b.dataset.sub)));
        box.querySelectorAll('[data-status]').forEach(b => b.onclick = () => statusForm(wo.data.find(x => x.id == b.dataset.status)));
      };
      render();
      container.querySelector('[data-q]').oninput = render;
      container.querySelector('[data-s]').onchange = render;
      container.querySelector('[data-p]').onchange = render;
      container.querySelector('[data-new]') && (container.querySelector('[data-new]').onclick = () => newOrder(wts.data, workers));
    });
  };

  function newOrder(wts, workers) {
    UI.modal({
      title: 'New work order', icon: 'add_task', wide: true,
      body: `<div class="form-grid">
        <div class="field full"><label>Title</label><input class="input" data-title placeholder="e.g. 10 Sheesham beds — Heritage Hotel" /></div>
        <div class="field"><label>Work type</label><select class="select" style="width:100%" data-wt>${wts.map(w => `<option value="${w.name}" data-rate="${w.rate}">${esc(w.name)} — ${money(w.rate)}/${esc(w.unit)}</option>`).join('')}</select></div>
        <div class="field"><label>Quantity</label><input class="input" type="number" data-qty value="10" /></div>
        <div class="field"><label>Assign to</label><select class="select" style="width:100%" data-worker>${workers.map(w => `<option value="${w.id}" data-role="${w.role}">${esc(w.name)} (${w.role})</option>`).join('')}</select></div>
        <div class="field"><label>Priority</label><select class="select" style="width:100%" data-prio><option>low</option><option selected>medium</option><option>high</option><option>urgent</option></select></div>
        <div class="field"><label>Deadline</label><input class="input" type="date" data-deadline /></div>
      </div>
      <p class="muted small">Payment is auto-generated when the worker submits completed units.</p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="wo-ok">Assign order</button>`,
    });
    $('#wo-ok').onclick = async () => {
      const wsel = document.querySelector('[data-worker]');
      const worker = workers.find(w => w.id == wsel.value);
      await API.post('/api/work/orders', {
        title: document.querySelector('[data-title]').value, work_type: document.querySelector('[data-wt]').value,
        qty: +document.querySelector('[data-qty]').value, priority: document.querySelector('[data-prio]').value,
        deadline: document.querySelector('[data-deadline]').value, assigned_to: worker.id, assignee_role: worker.role,
      });
      toast('ok', 'Order assigned', worker.name + ' notified');
      window.VinosheelApp.go('/work');
    };
  }

  function submitForm(o) {
    UI.modal({
      title: 'Submit completed work', icon: 'task_alt',
      body: `<p class="muted mb-8">Order: <b>${esc(o.title)}</b> · ${num(o.qty)} × ${esc(o.work_type)} @ ${money(o.rate)}</p>
        <div class="field"><label>Units completed</label><input class="input" type="number" data-q value="${o.qty}" /></div>
        <div class="field"><label>Work type</label><select class="select" style="width:100%" data-wt><option selected>${esc(o.work_type)}</option></select></div>
        <div class="card card-pad" style="background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.2)">
          <b class="small">Auto payment preview</b>
          <div class="row between mt-8"><span class="muted">Rate</span><b class="mono">${money(o.rate)}</b></div>
          <div class="row between"><span class="muted">Estimated payment</span><b class="mono" style="font-size:18px;color:var(--green)">${money(o.qty * o.rate)}</b></div>
        </div>
        <p class="muted small mt-8">Submission goes to Admin for approval, then payment is released automatically.</p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-green" id="sub-ok"><span class="icon material-symbols-outlined">send</span> Submit work</button>`,
    });
    $('#sub-ok').onclick = async () => {
      const { data } = await API.post('/api/work/orders/' + o.id + '/submit', {
        work_type: o.work_type, qty_completed: +document.querySelector('[data-q]').value,
      });
      toast('ok', 'Work submitted', 'Payment ₹' + data.amount.toLocaleString('en-IN') + ' generated — awaiting admin approval');
      window.VinosheelApp.go('/work');
    };
  }

  function statusForm(o) {
    UI.modal({
      title: 'Update order', icon: 'update',
      body: `<div class="form-grid">
        <div class="field"><label>Status</label><select class="select" style="width:100%" data-s>
          ${['todo', 'in_progress', 'under_review', 'done', 'cancelled'].map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Progress %</label><input class="input" type="number" data-p value="${o.progress}" min="0" max="100" /></div>
      </div>
      <div class="field"><label>Supervisor remarks</label><textarea class="input" data-r rows="2">${esc(o.supervisor_remarks || '')}</textarea></div>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="st-ok">Save</button>`,
    });
    $('#st-ok').onclick = async () => {
      await API.patch('/api/work/orders/' + o.id, {
        status: document.querySelector('[data-s]').value, progress: +document.querySelector('[data-p]').value,
        supervisor_remarks: document.querySelector('[data-r]').value,
      });
      toast('ok', 'Order updated');
      window.VinosheelApp.go('/work');
    };
  }

  function openDetail(o, workers) {
    const worker = workers.find(w => w.id === o.assigned_to);
    UI.modal({
      title: 'Order detail', icon: 'assignment', wide: true,
      body: `
      <div class="row between wrap">
        <div><h3 style="font-size:17px">${esc(o.title)}</h3>
          <p class="muted small">${num(o.qty)} × ${esc(o.work_type)} @ ${money(o.rate)} · est ${money(o.est_cost)} · due ${esc(o.deadline || '—')}</p></div>
        ${pill(o.status)}
      </div>
      <div class="row mt-16">
        <span class="avatar ${worker ? UI.avatarColor(worker.name) : ''}">${worker ? UI.initials(worker.name) : '?'}</span>
        <div><b>${worker ? esc(worker.name) : 'Unassigned'}</b><div class="muted small">${esc(o.assignee_role || '')} · assigned ${UI.ago(o.created_at)}</div></div>
        <div class="grow"></div>
        <div class="small"><b>Progress</b><div class="progress mt-8" style="width:120px"><i style="width:${o.progress}%"></i></div></div>
      </div>
      ${o.supervisor_remarks ? `<p class="mt-16" style="padding:10px 14px;background:var(--line-2);border-radius:10px" class="small">👷 Supervisor: ${esc(o.supervisor_remarks)}</p>` : ''}
      <div class="row mt-16">
        <button class="btn btn-ghost btn-sm" data-c>💬 Comment</button>
        <button class="btn btn-ghost btn-sm" data-cert>🏅 Completion certificate</button>
      </div>
      <div class="mt-16" data-comments></div>`,
      foot: `<button class="btn btn-primary" data-close>Close</button>`,
    });
    const box = document.querySelector('[data-comments]');
    box.innerHTML = `<p class="muted small">Comments will appear here. Attachments (images/videos) supported in production.</p>`;
    document.querySelector('[data-c]').onclick = () => {
      UI.modal({ title: 'Add comment', icon: 'comment',
        body: '<textarea class="input" data-t rows="3" placeholder="Update on progress…"></textarea><p class="muted small">Attachments: images/videos</p>',
        foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="cm-ok">Post</button>` });
      $('#cm-ok').onclick = async () => {
        await API.post('/api/work/orders/' + o.id + '/comments', { text: document.querySelector('[data-t]').value });
        toast('ok', 'Comment posted');
      };
    };
    document.querySelector('[data-cert]').onclick = () => {
      UI.modal({ title: 'Completion certificate', icon: 'workspace_premium',
        body: `<div style="text-align:center;padding:20px">
          <span class="icon material-symbols-outlined" style="font-size:56px;color:var(--amber)">workspace_premium</span>
          <h3>${esc(o.title)}</h3>
          <p class="muted small">This certifies completion of ${num(o.qty)} × ${esc(o.work_type)} at Vinosheel Trading.
          <br/>Quality: <b>Passed</b> · Reviewed by Operations</p></div>`,
        foot: `<button class="btn btn-ghost" data-close>Close</button><button class="btn btn-primary" data-close>Print</button>` });
    };
  }
})();

</script>

      container.innerHTML = `
      <div class="page-head"><div><h1>Billing &amp; GST</h1><p>GST invoices, quotations, estimates, receipts, credit notes & delivery challans. Barcode + QR on every bill.</p></div>
        <div class="spacer"></div>
        <button class="btn btn-primary" data-new><span class="icon material-symbols-outlined">receipt_long</span> New bill</button>
        <button class="btn btn-ghost" data-qr><span class="icon material-symbols-outlined">qr_code_scanner</span> Scan QR</button>
      </div>
      <div class="toolbar">
        <div class="search-box"><span class="icon material-symbols-outlined">search</span><input class="input" placeholder="Search invoice # or customer…" data-q /></div>
        <select class="select" data-t><option value="">All types</option><option>invoice</option><option>quotation</option><option>estimate</option><option>receipt</option><option>credit_note</option><option>delivery_challan</option></select>
        <select class="select" data-s><option value="">All statuses</option><option>paid</option><option>unpaid</option><option>overdue</option><option>draft</option></select>
      </div>
      <div class="card tbl-wrap"><table class="tbl">
        <thead><tr><th>Number</th><th>Customer</th><th>Type</th><th>Date</th><th>Subtotal</th><th>GST</th><th class="num">Total</th><th>Status</th><th class="text-right"></th></tr></thead>
        <tbody data-rows></tbody></table></div>`;

      const render = () => {
        const q = (container.querySelector('[data-q]').value || '').toLowerCase();
        const t = container.querySelector('[data-t]').value;
        const s = container.querySelector('[data-s]').value;
        const rows = inv.data.filter(i =>
          (!t || i.type === t) && (!s || i.status === s) &&
          (!q || (i.number + (i.customer_name || '')).toLowerCase().includes(q)));
        container.querySelector('[data-rows]').innerHTML = rows.map(i => `
          <tr>
            <td><b class="mono">${esc(i.number)}</b></td>
            <td>${esc(i.customer_name || '—')}</td>
            <td><span class="pill ${i.type === 'invoice' ? 'blue' : 'gray'}">${esc(i.type.replace(/_/g, ' '))}</span></td>
            <td class="muted">${esc(i.date)}</td>
            <td class="num">${money(i.subtotal)}</td>
            <td class="num">${money(i.tax)}</td>
            <td class="num strong">${money(i.total)}</td>
            <td>${pill(i.status)}</td>
            <td class="text-right"><button class="btn btn-ghost btn-sm" data-view="${i.id}">View</button></td>
          </tr>`).join('') || `<tr><td colspan="9">${UI.emptyState('receipt_long', 'No bills', 'Create your first GST bill')}</td></tr>`;
        container.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewInvoice(inv.data.find(x => x.id == b.dataset.view), cust.data));
      };
      render();
      container.querySelector('[data-q]').oninput = render;
      container.querySelector('[data-t]').onchange = render;
      container.querySelector('[data-s]').onchange = render;
      container.querySelector('[data-new]').onclick = () => newInvoice(cust.data, prods.data, inv.data);
      container.querySelector('[data-qr]').onclick = () => {
        UI.modal({ title: 'Scan QR / barcode', icon: 'qr_code_scanner',
          body: `<div class="card card-pad" style="text-align:center;padding:34px"><span class="icon material-symbols-outlined" style="font-size:70px;color:var(--brand-2)">qr_code_scanner</span>
          <p class="muted small">Simulated scanner — camera scans a bill's QR to open it instantly.</p></div>`,
          foot: '<button class="btn btn-primary" data-close>Done</button>' });
      };
    });
  };

  function newInvoice(custs, prods, all) {
    let lines = [{ product: '', qty: 1, price: 0 }];
    const render = () => {
      const body = document.querySelector('[data-lines]');
      body.innerHTML = lines.map((l, i) => `
        <div class="row mb-8" data-line="${i}">
          <select class="select grow" data-lp="${i}">
            <option value="">— select product —</option>
            ${prods.map(p => `<option value="${esc(p.name)}" data-price="${p.selling_price}" ${p.name === l.product ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
          <input class="input" style="width:70px" type="number" data-lq="${i}" value="${l.qty}" />
          <input class="input" style="width:110px" type="number" data-lpr="${i}" value="${l.price}" />
          <button class="icon-btn" data-del="${i}"><span class="icon material-symbols-outlined">remove_circle</span></button>
        </div>`).join('');
      body.querySelectorAll('select[data-lp]').forEach(s => s.onchange = () => {
        const i = +s.dataset.lp;
        const opt = s.selectedOptions[0];
        lines[i].product = s.value;
        lines[i].price = +opt.dataset.price || 0;
        document.querySelector(`[data-lpr="${i}"]`).value = lines[i].price;
        renderTotals();
      });
      body.querySelectorAll('[data-lq]').forEach(inp => inp.oninput = () => { lines[+inp.dataset.lq].qty = +inp.value || 0; renderTotals(); });
      body.querySelectorAll('[data-lpr]').forEach(inp => inp.oninput = () => { lines[+inp.dataset.lpr].price = +inp.value || 0; renderTotals(); });
      body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { lines.splice(+b.dataset.del, 1); render(); });
    };
    const renderTotals = () => {
      const subtotal = lines.reduce((s, l) => s + l.qty * l.price, 0);
      const disc = Math.min(subtotal * (+document.querySelector('[data-disc]').value || 0) / 100, subtotal);
      const tax = (subtotal - disc) * 0.18;
      const total = subtotal - disc + tax;
      document.querySelector('[data-totals]').innerHTML = `
        <div class="row between"><span class="muted">Subtotal</span><b class="mono">${money(subtotal)}</b></div>
        <div class="row between"><span class="muted">Discount</span><b class="mono down">−${money(disc)}</b></div>
        <div class="row between"><span class="muted">GST 18%</span><b class="mono">${money(tax)}</b></div>
        <div class="row between" style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><b>Grand total</b><b class="mono" style="font-size:18px;color:var(--brand-2)">${money(total)}</b></div>`;
      return total;
    };
    UI.modal({
      title: 'New GST bill', icon: 'receipt_long', wide: true,
      body: `
      <div class="form-grid">
        <div class="field"><label>Document type</label><select class="select" style="width:100%" data-type>
          <option value="invoice">Invoice (GST)</option><option value="quotation">Quotation</option><option value="estimate">Estimate</option>
          <option value="receipt">Payment receipt</option><option value="credit_note">Credit note</option><option value="delivery_challan">Delivery challan</option></select></div>
        <div class="field"><label>Customer</label><select class="select" style="width:100%" data-cust>
          ${custs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Discount %</label><input class="input" type="number" data-disc value="0" /></div>
        <div class="field"><label>Payment mode</label><select class="select" style="width:100%" data-mode><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Cheque</option><option>Credit</option></select></div>
      </div>
      <label class="small bold">Line items <span class="muted">(price is decided at billing — customers never see it)</span></label>
      <div class="mt-8" data-lines></div>
      <button class="btn btn-ghost btn-sm mt-8" data-addline><span class="icon material-symbols-outlined">add</span> Add line</button>
      <div class="mt-16" data-totals></div>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="inv-ok">Generate bill</button>`,
      onOpen: () => { render(); renderTotals(); },
    });
    document.querySelector('[data-addline]').onclick = () => { lines.push({ product: '', qty: 1, price: 0 }); render(); };
    document.querySelector('[data-disc]').oninput = renderTotals;
    $('#inv-ok').onclick = async () => {
      const items = lines.filter(l => l.product);
      if (!items.length) return toast('err', 'Add line items', 'Select at least one product');
      const cust = custs.find(c => c.id == document.querySelector('[data-cust]').value);
      const { data } = await API.post('/api/invoices', {
        type: document.querySelector('[data-type]').value, customer_id: cust.id, customer_name: cust.name,
        items, discount: +document.querySelector('[data-disc]').value, payment_mode: document.querySelector('[data-mode]').value,
        status: document.querySelector('[data-type]').value === 'receipt' ? 'paid' : 'unpaid',
      });
      toast('ok', data.number + ' generated', 'Total ' + money(data.total));
      window.VinosheelApp.go('/invoices');
    };
  }

    UI.modal({

        </div>

      foot: `<button class="btn btn-ghost" data-close>Close</button>
        ${inv.status !== 'paid' && inv.type === 'invoice' ? `<button class="btn btn-green" data-pay>Mark paid</button>` : ''}
        <button class="btn btn-primary" data-print>Print / PDF</button>`,
    });
    document.querySelector('[data-pay]') && (document.querySelector('[data-pay]').onclick = async () => {
      await API.post('/api/invoices/' + inv.id + '/pay', { mode: 'UPI' });
      toast('ok', 'Payment recorded', inv.number + ' is now paid');
      window.VinosheelApp.go('/invoices');
    });
    document.querySelector('[data-print]').onclick = () => {
      UI.printSheet(inv.number, document.querySelector('.modal .sheet').outerHTML);
    };
  }

  // ----------------------------------------------------------- customers
  window.Views.customers = function (container) {
    container.innerHTML = UI.skeleton(5);
    API.get('/api/customers').then(({ data }) => {
      container.innerHTML = `
      <div class="page-head"><div><h1>Customers</h1><p>Purchase records, GSTINs, notes & delivery status per customer.</p></div>
        <div class="spacer"></div><button class="btn btn-primary" data-add>+ Add customer</button></div>
      <div class="toolbar"><div class="search-box"><span class="icon material-symbols-outlined">search</span><input class="input" data-q placeholder="Search customers…" /></div></div>
      <div class="grid grid-3" data-list></div>`;
      const list = container.querySelector('[data-list]');
      const render = () => {
        const q = (container.querySelector('[data-q]').value || '').toLowerCase();
        list.innerHTML = data.filter(c => !q || (c.name + (c.gstin || '')).toLowerCase().includes(q)).map(c => `
          <div class="card hover card-pad">
            <div class="row">
              <span class="avatar ${UI.avatarColor(c.name)}">${UI.initials(c.name)}</span>
              <div><b>${esc(c.name)}</b><div class="muted small">${esc(c.type)} ${c.gstin ? '· ' + esc(c.gstin) : ''}</div></div>
            </div>
            <p class="muted small mt-8">${esc(c.phone || '')}${c.email ? ' · ' + esc(c.email) : ''}</p>
            <p class="muted small">${esc(c.notes || '')}</p>
            <button class="btn btn-ghost btn-sm mt-8" data-view="${c.id}">View / edit</button>
          </div>`).join('') || `<div class="card">${UI.emptyState('groups', 'No customers', '')}</div>`;
        list.querySelectorAll('[data-view]').forEach(b => b.onclick = () => editCustomer(data.find(c => c.id == b.dataset.view), data));
      };
      render();
      container.querySelector('[data-q]').oninput = render;
      container.querySelector('[data-add]').onclick = () => editCustomer(null, data);
    });
  };

  function editCustomer(c, all) {
    UI.modal({
      title: c ? c.name : 'New customer', icon: 'person_add',
      body: `<div class="form-grid">
        <div class="field"><label>Name</label><input class="input" data-f name value="${c ? esc(c.name) : ''}" /></div>
        <div class="field"><label>Phone</label><input class="input" data-f phone value="${c ? esc(c.phone || '') : ''}" /></div>
        <div class="field"><label>Email</label><input class="input" data-f email value="${c ? esc(c.email || '') : ''}" /></div>
        <div class="field"><label>GSTIN</label><input class="input" data-f gstin value="${c ? esc(c.gstin || '') : ''}" /></div>
        <div class="field"><label>Type</label><select class="select" style="width:100%" data-f type><option ${c && c.type === 'business' ? 'selected' : ''}>business</option><option ${!c || c.type !== 'business' ? 'selected' : ''}>retail</option></select></div>
        <div class="field"><label>Address</label><input class="input" data-f address value="${c ? esc(c.address || '') : ''}" /></div>
        <div class="field full"><label>Notes</label><input class="input" data-f notes value="${c ? esc(c.notes || '') : ''}" /></div>
      </div>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="c-ok">Save</button>`,
    });
    $('#c-ok').onclick = async () => {
      const body = {};
      document.querySelectorAll('[data-f]').forEach(i => body[i.dataset.f] = i.value);
      if (c) await API.patch('/api/customers/' + c.id, body);
      else await API.post('/api/customers', body);
      toast('ok', 'Customer saved');
      window.VinosheelApp.go('/customers');
    };
  }

  // ----------------------------------------------------------- suppliers
  window.Views.suppliers = function (container) {

      <div class="grid grid-3">
        ${sup.data.map(s => `
          <div class="card hover card-pad">
            <div class="row"><span class="avatar amber">${UI.initials(s.name)}</span>
              <div><b>${esc(s.name)}</b><div class="muted small">★ ${(s.rating || 0).toFixed(1)} · ${esc(s.address || '')}</div></div></div>
            <p class="muted small mt-8">${esc(s.phone || '')}${s.gstin ? ' · ' + esc(s.gstin) : ''}</p>
            <div class="row mt-8"><span class="pill ${s.rating >= 4.5 ? 'green' : s.rating >= 4 ? 'blue' : 'amber'}">${s.rating >= 4.5 ? 'Preferred vendor' : s.rating >= 4 ? 'Reliable' : 'Watch'}</span></div>

          <td class="text-right">${p.status !== 'received' ? `<button class="btn btn-green btn-sm" data-rec="${p.id}">Receive</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="6">${UI.emptyState('local_shipping', 'No purchase orders', '')}</td></tr>`}

      container.querySelector('[data-add]').onclick = () => {

      container.querySelectorAll('[data-rec]').forEach(b => b.onclick = async () => {

            <div style="flex:1">
              <b style="font-size:16px">${esc(p.name)}</b>

        $('#p-ok').onclick = async () => {

})();

<script>
/* Vinosheel ERP — Finance: cash flow, P&L, GST reports, expenses.
   Admin may edit financial records within 5 days only. */
(function () {
  const { $, esc, money, num, pill, toast } = window.UI;
  window.Views = window.Views || {};

  window.Views.finance = function (container) {
    container.innerHTML = UI.skeleton(5);
    Promise.all([
      API.get('/api/finance/summary'), API.get('/api/finance/pl'), API.get('/api/finance/cashflow'),
      API.get('/api/finance/gst-report'), API.get('/api/expenses'),
    ]).then(([sum, pl, cfResp, gst, exp]) => {
      container.innerHTML = `
      <div class="page-head"><div><h1>Finance</h1><p>Cash flow, profit & loss, GST filings and expenses. Financial edits are locked after 5 days (Admin-only beyond that).</p></div>
        <div class="spacer"></div>
        <button class="btn btn-ghost" data-exp>+ Expense</button>
        <button class="btn btn-primary" data-csv><span class="icon material-symbols-outlined">download</span> Export</button>

      ]);
    });
  };

  function cfChartData(sum, raw) {
    // downsample cashflow for a cleaner chart
    const full = raw ? raw.data : [];
    const step = Math.max(1, Math.floor(full.length / 45));
    const out = { data: [] };
    for (let i = 0; i < full.length; i += step) out.data.push(full[i]);
    if (full.length && out.data[out.data.length - 1] !== full[full.length - 1]) out.data.push(full[full.length - 1]);
    return out;
  }

          <button class="btn btn-ghost btn-sm mt-16" data-audit>View audit logs</button></div>
      </div>`;
      container.querySelector('[data-inv-csv]').onclick = () => UI.downloadCSV('invoices.csv', [['Number', 'Customer', 'Type', 'Date', 'Subtotal', 'GST', 'Total', 'Status'], ...inv.data.map(i => [i.number, i.customer_name, i.type, i.date, i.subtotal, i.tax, i.total, i.status])]);

      container.querySelector('[data-pdf]').onclick = () => {
        const inv0 = inv.data.find(i => i.type === 'invoice') || inv.data[0];
        UI.printSheet('sample-invoice', `
          <div class="head"><div><div style="font-size:22px;font-weight:800">Vinosheel Trading</div><div class="muted">GSTIN 09ABCDE1234F1Z5</div></div>
