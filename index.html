    materials: { icon: 'forest', title: 'Raw materials', kids: ['forest', 'format_color_fill', 'hardware', 'local_florist', 'vibration', 'construction'] },
    work: { icon: 'construction', title: 'Work orders', kids: ['chair', 'bed', 'door_sliding', 'table_restaurant', 'handyman', 'shelves'] },
    payments: { icon: 'payments', title: 'Payments', kids: ['currency_rupee', 'account_balance_wallet', 'savings', 'receipt_long', 'task_alt'] },
    sales: { icon: 'receipt_long', title: 'Billing & GST', kids: ['point_of_sale', 'qr_code_2', 'local_mall', 'shopping_cart', 'sell', 'receipt'] },
    customers: { icon: 'groups', title: 'Customers', kids: ['person', 'group', 'favorite', 'call', 'mail'] },
    suppliers: { icon: 'local_shipping', title: 'Suppliers', kids: ['local_shipping', 'warehouse', 'inventory_2', 'handshake', 'factory'] },
    catalogue: { icon: 'photo_library', title: 'Photo catalogue', kids: ['chair', 'tv', 'weekend', 'kitchen', 'lightbulb', 'bed'] },
    finance: { icon: 'account_balance', title: 'Finance', kids: ['payments', 'savings', 'trending_up', 'account_balance', 'currency_rupee', 'pie_chart'] },
    reports: { icon: 'monitoring', title: 'Reports', kids: ['bar_chart', 'pie_chart', 'monitoring', 'query_stats', 'insights'] },
    ai: { icon: 'auto_awesome', title: 'AI Assistant', kids: ['spark', 'psychology', 'neurology', 'auto_awesome', 'lightbulb'] },
    users: { icon: 'group_add', title: 'Employees', kids: ['badge', 'person', 'group', 'engineering', 'manage_accounts'] },
    approvals: { icon: 'fact_check', title: 'Approvals', kids: ['verified', 'check_circle', 'task_alt', 'rule', 'how_to_reg'] },
    attendance: { icon: 'event_available', title: 'Attendance', kids: ['event_available', 'fingerprint', 'location_on', 'face', 'schedule'] },
    payroll: { icon: 'payments', title: 'Payroll', kids: ['account_balance_wallet', 'payments', 'receipt_long', 'savings', 'verified_user'] },
    audit: { icon: 'manage_search', title: 'Audit trail', kids: ['manage_search', 'verified_user', 'history', 'fact_check', 'security'] },
    backup: { icon: 'backup', title: 'Backups', kids: ['backup', 'cloud_done', 'cloud', 'history', 'database'] },
    company: { icon: 'apartment', title: 'Company', kids: ['apartment', 'business', 'domain', 'storefront', 'badge'] },
    security: { icon: 'verified_user', title: 'Security', kids: ['verified_user', 'lock', 'fingerprint', 'shield_lock', 'vpn_key'] },
    exports: { icon: 'download', title: 'Exports', kids: ['download', 'picture_as_pdf', 'table_view', 'file_copy', 'print'] },
    register: { icon: 'person_add', title: 'Create account', kids: ['person_add', 'badge', 'group_add', 'engineering', 'verified_user'] },
    profile: { icon: 'person', title: 'Profile', kids: ['person', 'badge', 'settings', 'verified_user', 'palette'] },
  };
  const DEFAULT_BURST = { icon: 'widgets', title: 'Vinosheel', kids: ['chair', 'tv', 'weekend', 'kitchen', 'ac_unit', 'bed', 'local_laundry_service', 'table_restaurant'] };

  // ------------------------------------------------------------ login scene
  function loginScene3D(host) {
    if (REDUCED) return;
    // ---- gold particle canvas ----
    const canvas = document.createElement('canvas');
    canvas.className = 'gold-canvas';
    host.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let W, H, parts = [], raf = null;
    function size() { W = canvas.width = host.clientWidth; H = canvas.height = host.clientHeight; }
    size();
    for (let i = 0; i < 46; i++) {
      parts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + .6, s: Math.random() * .5 + .15, o: Math.random() * Math.PI * 2, a: Math.random() * .4 + .2 });
    }
    function tick() {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(p => {
        p.y -= p.s; p.o += .02;
        if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245,197,66,${p.a * (0.7 + 0.3 * Math.sin(p.o))})`;
        ctx.shadowColor = 'rgba(245,197,66,.9)'; ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    window.addEventListener('resize', size);

    // ---- 3D orbiting product ring ----
    const PRODS = [
      { icon: 'weekend', name: 'Sofa' }, { icon: 'bed', name: 'Bed' }, { icon: 'ac_unit', name: 'AC' },
      { icon: 'kitchen', name: 'Fridge' }, { icon: 'tv', name: 'TV' }, { icon: 'local_laundry_service', name: 'Washing' },
      { icon: 'chair', name: 'Chair' }, { icon: 'table_restaurant', name: 'Dining' },
    ];
    const ring = document.createElement('div');
    ring.className = 'orbit-ring';
    ring.innerHTML = PRODS.map((p, i) => `
      <div class="orbit-card" style="--i:${i};--n:${PRODS.length}">
        <span class="icon material-symbols-outlined">${p.icon}</span>
        <b>${p.name}</b>
      </div>`).join('');
    host.appendChild(ring);

    // ---- center stage (behind cards) ----
    const core = document.createElement('div');
    core.className = 'orbit-core';
    core.innerHTML = '<span class="icon material-symbols-outlined">villa</span><b>Vinosheel</b><small>Furniture &amp; Electronics</small>';
    host.appendChild(core);

    // ---- mouse parallax (elastic, clamped per UI UX Pro Max) ----
    const scene = host;
    let tx = 0, ty = 0, cx = 0, cy = 0;
    scene.addEventListener('mousemove', e => {
      const r = scene.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width - .5) * 10;
      ty = ((e.clientY - r.top) / r.height - .5) * 8;
    });
    scene.addEventListener('mouseleave', () => { tx = 0; ty = 0; });
    (function parallax() {
      cx += (tx - cx) * .08; cy += (ty - cy) * .08;
      ring.style.transform = `rotateX(${-cy}deg) rotateY(${cx}deg)`;
      core.style.transform = `translate3d(${cx * .6}px, ${cy * .6}px, 0)`;
      requestAnimationFrame(parallax);
    })();
    return { canvas, ring, core, stop() { if (raf) cancelAnimationFrame(raf); } };
  }

  // ------------------------------------------------------------- burst nav
  function burstTo(route, onDone) {
    if (REDUCED || window.VINOSHEEL_3D_OFF) { onDone(); return; }
    // never stack two transitions
    const old = document.querySelector('.burst3d');
    if (old) old.remove();
    const cfg = PAGE_BURST[route] || DEFAULT_BURST;
    const root = document.createElement('div');
    root.className = 'burst3d';
    root.innerHTML = `
      <div class="burst-backdrop"></div>
      <div class="burst-stage">
        <div class="burst-parent">
          <span class="icon material-symbols-outlined">${cfg.icon}</span>
        </div>
        ${cfg.kids.map((k, i) => `<div class="burst-kid" data-i="${i}"><span class="icon material-symbols-outlined">${k}</span></div>`).join('')}
        <div class="burst-title">${cfg.title}</div>
      </div>`;
    document.body.appendChild(root);

    const kids = root.querySelectorAll('.burst-kid');
    const n = kids.length;
    // explode outward in 3D
    kids.forEach((el, i) => {
      const ang = (i / n) * Math.PI * 2;
      const dist = 130 + (i % 3) * 55;
      const z = (i % 2 ? 90 : -70) + (i % 4) * 40;
      el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      el.style.setProperty('--dz', z + 'px');
      el.style.setProperty('--rot', (i % 2 ? 1 : -1) * (140 + i * 18) + 'deg');
      el.style.animationDelay = (i * 26) + 'ms';
    });
    const parent = root.querySelector('.burst-parent');
    parent.style.animation = 'burstParent .7s cubic-bezier(.2,.8,.2,1)';

    setTimeout(() => { onDone(); }, 420);
    setTimeout(() => {
      root.classList.add('burst-out');
      setTimeout(() => root.remove(), 500);
    }, 950);
  }

  window.Anim3D = { loginScene3D, burstTo, PAGE_BURST };
})();

</script>
<script>
/* Vinosheel ERP — API client.
   Talks to the FastAPI backend; if the backend is unreachable (static
   preview / file:// ), transparently falls back to the in-browser demo engine
   so the whole prototype stays clickable. */
(function () {
  const BASE = window.location.origin.startsWith('http')
    ? window.location.origin
    : '';
  let demoMode = false;

  // Storage wrapper: some phone preview browsers / privacy modes block
  // localStorage — fall back to in-memory so login still works.
  const memStore = {};
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return memStore[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } },
    remove(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } },
  };

  function session() {
    try { return JSON.parse(storage.get('vinosheel_session') || 'null'); }
    catch (e) { return null; }
  }
  function setSession(s) {
    if (s) storage.set('vinosheel_session', JSON.stringify(s));
    else storage.remove('vinosheel_session');
  }

  async function request(method, path, body, opts = {}) {
    const s = session();
    const headers = { 'Content-Type': 'application/json' };
    if (s && s.token) headers.Authorization = 'Bearer ' + s.token;
    headers['x-device'] = navigator.platform + ' / ' + navigator.userAgent.slice(0, 40);
    if (opts.headers) Object.assign(headers, opts.headers);

    const forcedDemo = window.VINOSHEEL_STANDALONE === true;
    if (!demoMode && BASE && !forcedDemo) {
      try {
        const res = await fetch(BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
        const text = await res.text();
        const trimmed = (text || '').trim();
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        const looksLikeJson = ct.includes('json') || trimmed.startsWith('{') || trimmed.startsWith('[');
        let json = {};
        if (looksLikeJson) {
          try { json = trimmed ? JSON.parse(trimmed) : {}; } catch (e) { json = {}; }
        } else {
          // The host answered with HTML (SPA-style fallback, viewer proxy,
          // static server) — there is no live backend here. Use the demo engine.
          demoMode = true;
          window.VinosheelDemo = true;
        }
        if (!demoMode && res.status === 401 && opts.retry !== false && s && s.refresh) {
          const ok = await tryRefresh(s);
          if (ok) return request(method, path, body, { ...opts, retry: false });
        }
        if (!demoMode && !res.ok) {
          // A structured API error means the backend is real -> surface it.
          if (json && json.detail !== undefined) {
            throw Object.assign(new Error(json.detail || ('HTTP ' + res.status)), { status: res.status, body: json });
          }
          // 404/500 without a structured body on a JSON endpoint -> no backend.
          demoMode = true;
          window.VinosheelDemo = true;
        }
        if (!demoMode) return { status: res.status, data: json };
      } catch (err) {
        if (err && err.status && !err.noDemoFallback) throw err;
        // network failure -> demo mode
        demoMode = true;
        window.VinosheelDemo = true;
      }
    }
    // demo engine
    const [status, data] = window.VinosheelMock.route(path, method, body || {}, s);
    await new Promise(r => setTimeout(r, 120 + Math.random() * 220));
    if (status >= 400 && !opts.quiet) throw Object.assign(new Error(data.detail || 'Request failed'), { status, body: data });
    return { status, data };
  }

  async function tryRefresh(s) {
    try {
      const res = await fetch(BASE + '/api/auth/refresh', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh }),
      });
      if (!res.ok) return false;
      const json = await res.json();
      s.token = json.access_token;
      setSession(s);
      return true;
    } catch (e) { return false; }
  }

  window.API = {
    get: (p, o) => request('GET', p, undefined, o),
    post: (p, b, o) => request('POST', p, b, o),
    patch: (p, b, o) => request('PATCH', p, b, o),
    del: (p, o) => request('DELETE', p, undefined, o),
    session, setSession, demoMode: () => demoMode,
  };
})();

</script>
<script>
/* Vinosheel ERP — UI kit: toasts, modals, confirm, skeleton, helpers. */
(function () {
  const $ = sel => document.querySelector(sel);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function money(n, d = 0) {
    const v = Number(n || 0);
    return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function num(n, d = 0) { return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: d }); }
  function ago(iso) {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    const s = Math.floor((Date.now() - t) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function initials(name) {
    return String(name || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }
  function avatarColor(name) {
    const n = (name || '?').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    return ['', 'green', 'violet', 'amber', 'rose', 'cyan'][n % 6];
  }

  // ---------------- toasts ----------------
  function toast(type, title, msg, ms = 4200) {
    const root = $('#toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ic = { ok: 'check_circle', err: 'error', info: 'info' }[type] || 'info';
    el.innerHTML = `<span class="t-ic"><span class="icon material-symbols-outlined">${ic}</span></span>
      <div><b>${esc(title)}</b>${msg ? `<p>${esc(msg)}</p>` : ''}</div>`;
    root.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, ms);
  }

  // ---------------- modal ----------------
  function modal({ title = '', icon = 'task_alt', body = '', foot = '', wide = false, onOpen } = {}) {
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-back">
      <div class="modal${wide ? ' wide' : ''}">
        <div class="modal-head">
          <span class="icon material-symbols-outlined">${icon}</span>
          <h3>${esc(title)}</h3>
          <button class="icon-btn x" data-close><span class="icon material-symbols-outlined">close</span></button>
        </div>
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div></div>`;
    root.querySelector('[data-close]').onclick = () => closeModal();
    root.querySelector('.modal-back').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-back')) closeModal(); });
    if (onOpen) onOpen(root);
    return root;
  }
  function closeModal() { $('#modal-root').innerHTML = ''; }

  function confirmDlg({ title, msg, okText = 'Confirm', danger = false, onOk }) {
    modal({
      title, icon: danger ? 'warning' : 'help', wide: false,
      body: `<p class="muted">${esc(msg)}</p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cf-ok">${esc(okText)}</button>`,
    });
    $('#cf-ok').onclick = () => { closeModal(); onOk && onOk(); };
    document.querySelector('[data-close]').onclick = closeModal;
  }

  function skeleton(lines = 4) {
    return '<div class="card card-pad">' + Array.from({ length: lines }, () => '<div class="skel" style="height:18px;margin-bottom:12px"></div>').join('') + '</div>';
  }

  // ---------------- dropdown ----------------
  function menu(anchor, items) {
    const r = anchor.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'menu';
    el.style.top = (r.bottom + 8) + 'px';
    el.style.left = Math.min(r.left, window.innerWidth - 230) + 'px';
    el.innerHTML = items.map(it => it.sep ? '<div class="sep"></div>' :
      `<button class="${it.danger ? 'danger' : ''}" data-act="${esc(it.id)}"><span class="icon material-symbols-outlined">${esc(it.icon || 'chevron_right')}</span>${esc(it.label)}</button>`).join('');
    document.body.appendChild(el);
    el.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => { el.remove(); itAction(b.dataset.act); });
    const kill = e => { if (!el.contains(e.target)) { el.remove(); document.removeEventListener('mousedown', kill); } };
    setTimeout(() => document.addEventListener('mousedown', kill), 0);
    let itAction = () => {};
    return { onAction: fn => itAction = fn };
  }

  function pill(status) {
    const map = {
      paid: ['green', 'Paid'], present: ['green', 'Present'], active: ['green', 'Active'], done: ['green', 'Done'],
      approved: ['green', 'Approved'], received: ['green', 'Received'], success: ['green', 'Success'], high: ['red', 'High'],
      unpaid: ['amber', 'Unpaid'], pending: ['amber', 'Pending'], todo: ['gray', 'Todo'], half_day: ['amber', 'Half Day'],
      overdue: ['red', 'Overdue'], rejected: ['red', 'Rejected'], suspended: ['red', 'Suspended'], urgent: ['red', 'Urgent'],
      in_progress: ['blue', 'In Progress'], under_review: ['violet', 'Under Review'], medium: ['blue', 'Medium'],
      partial: ['violet', 'Partial'], draft: ['gray', 'Draft'], cancelled: ['gray', 'Cancelled'], absent: ['red', 'Absent'],
      leave: ['gray', 'Leave'], open: ['blue', 'Open'], low: ['gray', 'Low'], draft_: ['gray', 'Draft'],
    };
    const [cls, label] = map[status] || ['gray', status || '—'];
    return `<span class="pill ${cls}">${esc(label)}</span>`;
  }

  function roleChip(role) { return `<span class="role-chip ${esc(role)}">${esc(String(role).replace(/_/g, ' '))}</span>`; }

  function emptyState(icon, title, msg) {
    return `<div class="empty"><span class="icon material-symbols-outlined">${esc(icon)}</span><b>${esc(title)}</b><p>${esc(msg)}</p></div>`;
  }

  function downloadCSV(filename, rows) {
    const csv = rows.map(r => r.map(c => {
      const s = String(c == null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function printSheet(title, html) {
    const w = window.open('', '_blank', 'width=900,height=700');
    w.document.write(`<!DOCTYPE html><html><head><title>${esc(title)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
      <style>body{font-family:Inter,sans-serif;padding:36px;color:#0F172A}
      table{width:100%;border-collapse:collapse;margin-top:14px}td,th{border:1px solid #CBD5E1;padding:9px 12px;font-size:13px;text-align:left}
      th{background:#F1F5F9}.head{display:flex;justify-content:space-between;border-bottom:3px solid #1E3A8A;padding-bottom:14px}
      .num{text-align:right}.tot td{font-weight:700;background:#F8FAFC}.muted{color:#64748B;font-size:12px}</style></head><body>${html}<script>window.print()<\/script></body></html>`);
    w.document.close();
  }

  function toastify(fn) {
    return async (...args) => {
      try { return await fn(...args); }
      catch (e) { toast('err', 'Something went wrong', e.message || 'Please try again'); throw e; }
    };
  }


  // 3D mouse-tilt effect for .tilt3d elements (disabled on touch / reduced motion)
  function tilt3d(container) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    container.querySelectorAll('.tilt3d').forEach(el => {
      if (isTouch) return;
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - .5;
        const py = (e.clientY - r.top) / r.height - .5;
        el.style.transform = `perspective(900px) rotateY(${px * 14}deg) rotateX(${-py * 14}deg) translateY(-4px)`;
        const glow = el.querySelector('.p-glow');
        if (glow) glow.style.opacity = 1;
      });
      el.addEventListener('mouseleave', () => {
        el.style.transform = '';
        const glow = el.querySelector('.p-glow');
        if (glow) glow.style.opacity = 0;
      });
    });
  }

  window.UI = { tilt3d, $, esc, money, num, ago, initials, avatarColor, toast, modal, closeModal, confirmDlg, skeleton, menu, pill, roleChip, emptyState, downloadCSV, printSheet, toastify };
})();

</script>
<script>
/* Vinosheel ERP — lightweight canvas charts (bar, line, doughnut, heatmap).
   No external deps; theme-aware; auto-resizes with its container. */
(function () {
  const CSS = getComputedStyle(document.documentElement);

  function colors() {
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#0F172A';
    const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#64748B';
    const line = getComputedStyle(document.documentElement).getPropertyValue('--line').trim() || '#E2E8F0';
    return { ink, muted, line };
  }

  function makeCanvas(container, height = 240) {
    const canvas = document.createElement('canvas');
    canvas.style.height = height + 'px';
    container.appendChild(canvas);
    const dpr = window.devicePixelRatio || 1;
    const w = container.clientWidth || 600;
    canvas.width = w * dpr;
    canvas.height = height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return { canvas, ctx, w, h: height };
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const d = v / p;
    const m = d <= 1 ? 1 : d <= 2 ? 2 : d <= 2.5 ? 2.5 : d <= 5 ? 5 : 10;
    return m * p;
  }

  function bar(container, data, opts = {}) {
    const { ctx, w, h } = makeCanvas(container, opts.height || 240);
    const { ink, muted, line } = colors();
    const padL = opts.padL || 52, padR = 10, padT = 14, padB = opts.labels ? 34 : 16;
    const max = niceMax(Math.max(...data.map(d => d.value), 1));
    const iw = w - padL - padR, ih = h - padT - padB;
    const n = data.length;
    const bw = Math.min(iw / n * 0.62, 44);
    const step = iw / n;

    ctx.clearRect(0, 0, w, h);
    // grid
    ctx.font = '11px Inter';
    ctx.textAlign = 'right'; ctx.fillStyle = muted;
    for (let g = 0; g <= 4; g++) {
      const y = padT + ih - (ih * g / 4);
      const val = max * g / 4;
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText(opts.fmt ? opts.fmt(val) : compact(val), padL - 8, y + 4);
    }
    // bars
    data.forEach((d, i) => {
      const x = padL + step * i + (step - bw) / 2;
      const bh = ih * (d.value / max);
      const y = padT + ih - bh;
      const grad = ctx.createLinearGradient(0, y, 0, padT + ih);
      grad.addColorStop(0, d.color || '#2563EB');
      grad.addColorStop(1, d.color2 || '#1E3A8A');
      ctx.fillStyle = grad;
      roundRect(ctx, x, y, bw, Math.max(bh, 1), 5);
      ctx.fill();
      if (opts.labels && i % Math.ceil(n / 12) === 0) {
        ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.font = '10px Inter';
        ctx.fillText(String(d.label).slice(0, 8), x + bw / 2, h - 8);
      }
    });
  }

  function line(container, series, opts = {}) {
    const { ctx, w, h } = makeCanvas(container, opts.height || 240);
    const { ink, muted, line } = colors();
    const padL = opts.padL || 52, padR = 12, padT = 14, padB = opts.labels ? 32 : 14;
    const all = series.flatMap(s => s.points.map(p => p.value));
    const max = niceMax(Math.max(...all, 1));
    const iw = w - padL - padR, ih = h - padT - padB;

    ctx.clearRect(0, 0, w, h);
    ctx.font = '11px Inter'; ctx.textAlign = 'right'; ctx.fillStyle = muted;
    for (let g = 0; g <= 4; g++) {
      const y = padT + ih - (ih * g / 4);
      ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText(compact(max * g / 4), padL - 8, y + 4);
    }
    series.forEach((s, si) => {
      const pts = s.points;
      if (!pts.length) return;
      const xAt = i => padL + iw * (i / Math.max(pts.length - 1, 1));
      const yAt = v => padT + ih - ih * (v / max);
      ctx.beginPath();
      pts.forEach((p, i) => { const x = xAt(i), y = yAt(p.value); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
      ctx.strokeStyle = s.color || (si ? '#10B981' : '#2563EB');
      ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.stroke();
      // area fill
      const grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
      grad.addColorStop(0, (s.color || '#2563EB') + '40');
      grad.addColorStop(1, (s.color || '#2563EB') + '00');
      ctx.lineTo(xAt(pts.length - 1), padT + ih); ctx.lineTo(xAt(0), padT + ih); ctx.closePath();
      ctx.fillStyle = grad; ctx.fill();
    });
    if (opts.labels) {
      const pts = series[0].points;
      ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.font = '10px Inter';
      const n = pts.length;
      pts.forEach((p, i) => {
        if (i % Math.ceil(n / 8) === 0) ctx.fillText(String(p.label || p.date || '').slice(5), padL + iw * (i / Math.max(n - 1, 1)), h - 8);
      });
    }
    if (opts.legend) {
      ctx.textAlign = 'left'; ctx.font = '11px Inter';
      let lx = padL;
      series.forEach((s, si) => {
        ctx.fillStyle = s.color || '#2563EB';
        ctx.fillRect(lx, 8, 10, 10);
        ctx.fillStyle = muted;
        ctx.fillText(s.name, lx + 15, 17);
        lx += 15 + ctx.measureText(s.name).width + 20;
      });
    }
  }

  function doughnut(container, data, opts = {}) {
    const { ctx, w, h } = makeCanvas(container, opts.height || 220);
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 18;
    const palette = ['#2563EB', '#10B981', '#F59E0B', '#8B5CF6', '#EF4444', '#14B8A6', '#64748B', '#1E3A8A'];
    ctx.clearRect(0, 0, w, h);
    let a = -Math.PI / 2;
    data.forEach((d, i) => {
      const sweep = (d.value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a, a + sweep);
      ctx.closePath();
      ctx.fillStyle = d.color || palette[i % palette.length];
      ctx.fill();
      a += sweep;
    });
    // center hole
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-2').trim() || '#fff';
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    ctx.textAlign = 'center'; ctx.font = '700 20px Inter';
    ctx.fillText(opts.center || compact(total), cx, cy - 2);
    ctx.font = '10px Inter'; ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    ctx.fillText(opts.centerLabel || 'TOTAL', cx, cy + 14);

    // legend
    ctx.textAlign = 'left'; ctx.font = '11px Inter';
    const ly = h - 16;
    let lx = 12;
    const legend = opts.legend === false ? [] : data.slice(0, 6);
    legend.forEach((d, i) => {
      const label = String(d.label).slice(0, 14);
      const c = d.color || palette[i % palette.length];
      const tw = ctx.measureText(label).width;
      if (lx + tw + 24 > w - 10 && lx > 12) { lx = 12; }
      ctx.fillStyle = c; ctx.fillRect(lx, ly - 9, 9, 9);
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
      ctx.fillText(label, lx + 13, ly);
      lx += tw + 26;
    });
  }

  function heatmap(container, cells, opts = {}) {
    // cells: [{label, value, date}]
    const el = document.createElement('div');
    el.className = 'heatmap';
    const max = Math.max(...cells.map(c => c.value), 1);
    const palette = ['#E0E7FF', '#93C5FD', '#60A5FA', '#2563EB', '#1E3A8A', '#10B981'];
    cells.forEach(c => {
      const cell = document.createElement('div');
      const idx = Math.min(palette.length - 1, Math.floor((c.value / max) * palette.length));
      cell.className = 'hm-cell';
      cell.style.background = c.value === 0 ? 'var(--line-2)' : palette[idx];
      cell.textContent = c.value > 0 ? c.value : '';
      cell.title = (c.label || '') + ': ' + c.value;
      el.appendChild(cell);
    });
    container.appendChild(el);
  }

  function compact(v) {
    if (v >= 1e7) return (v / 1e7).toFixed(1) + 'Cr';
    if (v >= 1e5) return (v / 1e5).toFixed(1) + 'L';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'k';
    return String(Math.round(v));
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (h <= 0) return;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  let resizeTimer;
  function wireResize(container, redraw) {
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        container.innerHTML = '';
        redraw();
      }, 180);
    });
  }

  window.Charts = { bar, line, doughnut, heatmap, compact, wireResize };
})();

  function showOtp(email, devOtp, purpose, bioKind = '') {

      <div class="auth-card">

        <div class="row between mt-16">
          <a class="link" data-back>Back</a>

    const box = document.querySelector('[data-otp]');
    for (let i = 0; i < 6; i++) {
      const inp = document.createElement('input');
      inp.className = 'input'; inp.maxLength = 1; inp.inputMode = 'numeric';
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '');

      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && box.children[i - 1]) box.children[i - 1].focus(); });
      box.appendChild(inp);
    }
    box.children[0].focus();
    mountAuthScene();
    const code = () => Array.from(box.children).map(i => i.value).join('');
    document.querySelector('[data-verify]').onclick = async () => {
      const c = code();
      if (c.length !== 6) return toast('err', 'Incomplete code', 'Enter all 6 digits');
      try {
        const { data } = await API.post('/api/auth/otp-verify', { email, code: c, purpose, remember: true });

        window.VinosheelApp.enter(data.user);
      } catch (err) { toast('err', 'Verification failed', err.message); }

    document.querySelector('[data-resend]').onclick = async () => {
      toast('info', 'OTP resent', 'A new code has been sent (demo: 123456)');

          <div class="row mt-16" style="gap:8px">

          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="icon material-symbols-outlined">history</span><h3>Login history</h3></div>
        <div class="card-pad">
          ${lh.data.map(h => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line-2)">
            <span class="icon material-symbols-outlined" style="color:var(--muted)">${h.status === 'failed' ? 'block' : h.status === 'otp_required' ? 'sms' : 'login'}</span>

      wrap.querySelector('[data-killall]').onclick = () => UI.confirmDlg({ title: 'Revoke all sessions', msg: 'You will be signed out everywhere.', danger: true, onOk: async () => { await API.post('/api/auth/sessions/revoke-all'); toast('ok', 'All sessions revoked'); window.VinosheelApp.exit(); } });

      wrap.querySelector('[data-bio-fp]').onclick = async () => { await API.post('/api/auth/biometrics/enroll', { kind: 'finger' }); toast('ok', 'Fingerprint enrolled', 'Simulated — WebAuthn in production'); };

  window.VinosheelAuth = { showSplash, showLogin, showOtp, showForgot, showRegister, securityScreen };
